name: halqo
# MinIO only. MySQL is the EXISTING install in Debian WSL — never add a MySQL container here.
services:
  minio:
    image: minio/minio:latest
    container_name: halqo-minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: http://${LAN_IP}:9000   # presigned URLs must use an address phones can reach
    volumes: ["halqo-minio-data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio-init:
    image: minio/mc:latest
    container_name: halqo-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/halqo-media;
      mc mb --ignore-existing local/halqo-media-test;
      mc anonymous set none local/halqo-media;
      mc anonymous set none local/halqo-media-test;
      mc admin user add local $${MINIO_APP_USER} $${MINIO_APP_PASSWORD};
      mc admin policy attach local readwrite --user $${MINIO_APP_USER} || true;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_USER: ${MINIO_APP_USER}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD}
volumes:
  halqo-minio-data:
    name: halqo-minio-data
