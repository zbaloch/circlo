[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
ignoreUntil = 2027-01-31T00:00:00Z
reason = "zod 3 inside @expo/cli (build-time tool, validates our own config); not in the app bundle. Fixed only in zod 4; revisit with the next Expo SDK."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
ignoreUntil = 2027-01-31T00:00:00Z
reason = "crypto-bigint 0.5 timing: only reached through P-256/P-384 code in OpenMLS's provider; Halqo uses MLS ciphersuite 0x0003 (X25519/Ed25519) only, so no secret reaches it. Needs an upstream OpenMLS release."

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2027-01-31T00:00:00Z
reason = "block-buffer 0.10: needs a hash compression function to panic and the panic to be caught; hash functions don't panic. Fix needs the digest 0.11 generation (blocked by opaque-ke 4)."

