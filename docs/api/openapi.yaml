openapi: 3.1.0
info:
  title: Circlo API
  version: 1.0.0
  description: >
    circlo-server API, used by the iOS and Android apps and the web app (app.hellocirclo.com). Requests go over HTTPS;
    content is stored as sent and the server decides who may see it. IDs are UUID strings; times are ISO-8601 instants.
    Errors are `{"error": "<code>"}` (plus fixed details such as `attemptsLeft`) and never echo request data.
    Photos and videos go straight between the app and storage through short-lived presigned URLs.
servers:
  - url: http://localhost:8080
security:
  - bearer: []

paths:
  # ---------------- auth ----------------
  /v1/auth/signup:
    post:
      summary: Start a signup; emails a 6-digit code to verify the address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string, description: "3-30 of [a-z0-9_], case-insensitive" }
                email: { type: string }
                password: { type: string, description: "12-128 characters" }
      responses:
        "201":
          description: Code sent
          content:
            application/json:
              schema: { type: object, required: [email], properties: { email: { type: string } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/signup/resend:
    post:
      summary: Send a new code for an unfinished signup (says nothing about whether one exists)
      security: []
      requestBody: { $ref: "#/components/requestBodies/Email" }
      responses:
        "202": { $ref: "#/components/responses/Status" }
  /v1/auth/signup/verify:
    post:
      summary: Finish a signup with the emailed code; signs this device in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties: { email: { type: string }, code: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/auth/login:
    post:
      summary: Log in with a username or email and password
      description: >
        401 carries `attemptsLeft` (and `lockSeconds` when this failure set a lock); 429 `locked` carries `retryAfter`.
        An account whose email isn't verified yet answers 403 `email_not_verified` with `email`, and gets a fresh code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties: { login: { type: string }, password: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/refresh:
    post:
      summary: Rotate the refresh token (single use; reusing an old one signs out every device)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/auth/password/forgot:
    post:
      summary: Email a password-reset code (says nothing about whether the account exists)
      security: []
      requestBody: { $ref: "#/components/requestBodies/Email" }
      responses:
        "202": { $ref: "#/components/responses/Status" }
  /v1/auth/password/reset:
    post:
      summary: Set a new password with the emailed code; signs out every device and signs this one in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password]
              properties: { email: { type: string }, code: { type: string }, password: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/auth/password/change:
    post:
      summary: Change the password (signed in); other devices are signed out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties: { currentPassword: { type: string }, newPassword: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/logout:
    post:
      summary: Sign this device out
      responses:
        "200": { $ref: "#/components/responses/Status" }

  # ---------------- my account ----------------
  /v1/me:
    get:
      summary: My account
      responses:
        "200": { $ref: "#/components/responses/Me" }
  /v1/me/profile:
    put:
      summary: Change my name and bio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, bio]
              properties: { name: { type: string, description: "1-50 characters; empty clears it" }, bio: { type: string, description: "Up to 160 characters" } }
      responses:
        "200": { $ref: "#/components/responses/Me" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/me/avatar:
    put:
      summary: Set my photo to an image I just uploaded
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [objectKey], properties: { objectKey: { $ref: "#/components/schemas/ObjectKey" } } }
      responses:
        "200": { $ref: "#/components/responses/Me" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove my photo
      responses:
        "200": { $ref: "#/components/responses/Me" }
  /v1/me/export:
    get:
      summary: A copy of my data (profile, circles, friends, posts, replies, chats) as JSON
      responses:
        "200":
          description: My data
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /v1/me/preview/{friendId}:
    get:
      summary: My posts exactly as this friend sees them
      parameters:
        - { name: friendId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { $ref: "#/components/parameters/Before" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { $ref: "#/components/responses/Posts" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/account:
    delete:
      summary: Delete my account and everything in it (needs my password)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [password], properties: { password: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/devices:
    get:
      summary: The devices and browsers signed in to my account
      responses:
        "200":
          description: Devices, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [deviceId, createdAt, current]
                  properties:
                    deviceId: { $ref: "#/components/schemas/Id" }
                    createdAt: { type: string, format: date-time }
                    current: { type: boolean }
  /v1/devices/{deviceId}:
    delete:
      summary: Sign a device out
      parameters:
        - { name: deviceId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/devices/current/push-token:
    put:
      summary: Register this device's push token (content-free pushes; forgotten on sign-out or revoke)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, service]
              properties:
                token: { type: string }
                service: { type: string, enum: [apns, apns_sandbox] }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      summary: Stop pushes to this device
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /v1/events:
    get:
      summary: Live updates. Answers with my version as soon as it differs from `since` (at once if it already does), else after 25 s
      parameters:
        - { name: since, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: My current version; the app refreshes what it shows when it changes
          content:
            application/json:
              schema: { type: object, required: [version], properties: { version: { type: integer, format: int64 } } }
  /v1/devices/current/check-token:
    post:
      summary: Turn on background checks for this device; returns its check token
      responses:
        "200":
          description: The check token
          content:
            application/json:
              schema: { type: object, required: [token], properties: { token: { type: string } } }
    delete:
      summary: Turn background checks off for this device
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /v1/security-events:
    get:
      summary: Recent sign-ins to my account (30 days, newest first)
      responses:
        "200":
          description: Sign-ins
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      required: [id, kind, createdAt]
                      properties:
                        id: { $ref: "#/components/schemas/Id" }
                        kind: { type: string, enum: [sign_in] }
                        createdAt: { type: string, format: date-time }

  # ---------------- people ----------------
  /v1/users/{userId}:
    get:
      summary: Someone's profile (mine, or someone I'm connected with)
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: Their profile
          content:
            application/json:
              schema:
                type: object
                required: [userId, name, username, bio, relation, friendCount]
                properties:
                  userId: { $ref: "#/components/schemas/Id" }
                  name: { type: string }
                  username: { type: string }
                  bio: { type: string }
                  avatarUrl: { type: [string, "null"] }
                  relation: { type: string, enum: [me, accepted, incoming, outgoing] }
                  friendCount: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
  /v1/users/{userId}/posts:
    get:
      summary: Someone's posts that I may see, newest first
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { $ref: "#/components/parameters/Before" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { $ref: "#/components/responses/Posts" }
  /v1/users/{userId}/replies:
    get:
      summary: Someone's replies on posts I may see, newest first, each with its post
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { $ref: "#/components/parameters/Before" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Replies with their posts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [reply, post]
                  properties:
                    reply: { $ref: "#/components/schemas/Reply" }
                    post: { $ref: "#/components/schemas/Post" }
  /v1/invites:
    post:
      summary: A single-use invite link (7 days)
      responses:
        "201":
          description: The invite
          content:
            application/json:
              schema:
                type: object
                required: [token, link, expiresAt]
                properties:
                  token: { type: string }
                  link: { type: string }
                  expiresAt: { type: string, format: date-time }
        "409": { $ref: "#/components/responses/Error" }
  /v1/invites/redeem:
    post:
      summary: Use an invite; returns who sent it
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "200":
          description: Who sent it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/friends:
    get:
      summary: My friends and pending requests (with the circles I put each one in)
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [userId, status, since, name, username, circles]
                  properties:
                    userId: { $ref: "#/components/schemas/Id" }
                    status: { type: string, enum: [accepted, incoming, outgoing] }
                    since: { type: string, format: date-time }
                    name: { type: string }
                    username: { type: string }
                    avatarUrl: { type: [string, "null"] }
                    circles: { type: array, items: { type: integer } }
  /v1/friends/requests:
    post:
      summary: Ask someone whose invite I redeemed to connect, putting them in my circles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toUserId]
              properties:
                toUserId: { $ref: "#/components/schemas/Id" }
                circles: { type: array, items: { type: integer } }
      responses:
        "201": { $ref: "#/components/responses/Status" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/friends/{userId}:
    delete:
      summary: Unfriend (or cancel my request)
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/friends/{userId}/accept:
    post:
      summary: Accept a request, putting them in my circles
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { circles: { type: array, items: { type: integer } } } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/friends/{userId}/decline:
    post:
      summary: Decline a request
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/friends/{userId}/circles:
    put:
      summary: Set which of my circles they're in (silent)
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [circles], properties: { circles: { type: array, items: { type: integer } } } }
      responses:
        "200":
          description: The circles they're in now
          content:
            application/json:
              schema: { type: object, required: [circles], properties: { circles: { type: array, items: { type: integer } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/circles:
    get:
      summary: My circles with their members (only ever shown to me)
      responses:
        "200":
          description: My circles
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Circle" } }
    post:
      summary: Add a circle (up to 8)
      requestBody: { $ref: "#/components/requestBodies/CircleName" }
      responses:
        "201":
          description: The new circle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Circle" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/circles/{id}:
    put:
      summary: Rename a circle
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody: { $ref: "#/components/requestBodies/CircleName" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a circle (posts already shared with it keep their audience)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/blocks:
    get:
      summary: People I blocked
      responses:
        "200":
          description: Blocked people, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [userId, name, username, createdAt]
                  properties:
                    userId: { $ref: "#/components/schemas/Id" }
                    name: { type: string }
                    username: { type: string }
                    createdAt: { type: string, format: date-time }
  /v1/blocks/{userId}:
    post:
      summary: Block someone (ends any connection)
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Unblock
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /v1/reports:
    post:
      summary: Report a post, person or chat message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, targetId, reason]
              properties:
                kind: { type: string, enum: [post, user, message, reply] }
                targetId: { $ref: "#/components/schemas/Id" }
                reason: { type: string }
                note: { type: string }
      responses:
        "201": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }

  # ---------------- media ----------------
  /v1/media/uploads:
    post:
      summary: Upload slots (presigned PUT URLs locked to each size and type, 15 minutes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: object
                    required: [size, mime]
                    properties:
                      size: { type: integer, format: int64 }
                      mime: { type: string, enum: [image/jpeg, image/png, image/webp, video/mp4, video/quicktime, video/webm] }
      responses:
        "200":
          description: One slot per file, in order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [objectKey, putUrl, size, mime]
                  properties:
                    objectKey: { $ref: "#/components/schemas/ObjectKey" }
                    putUrl: { type: string }
                    size: { type: integer, format: int64 }
                    mime: { type: string }
        "400": { $ref: "#/components/responses/Error" }

  # ---------------- posts ----------------
  /v1/feed:
    get:
      summary: My posts and my friends' posts that I may see, newest first
      parameters:
        - { $ref: "#/components/parameters/Before" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { $ref: "#/components/responses/Posts" }
  /v1/posts:
    post:
      summary: Create a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, audience]
              properties:
                text: { type: string, description: "Up to 500 characters; may be empty with media" }
                audience: { $ref: "#/components/schemas/Audience" }
                media: { type: array, items: { $ref: "#/components/schemas/NewAttachment" } }
      responses:
        "201":
          description: The new post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}:
    get:
      summary: One post I may see
      parameters:
        - { $ref: "#/components/parameters/PostId" }
      responses:
        "200":
          description: The post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete my post
      parameters:
        - { $ref: "#/components/parameters/PostId" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}/replies:
    get:
      summary: Replies, oldest first
      parameters:
        - { $ref: "#/components/parameters/PostId" }
        - { name: after, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Replies
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Reply" } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Reply
      parameters:
        - { $ref: "#/components/parameters/PostId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [text], properties: { text: { type: string } } }
      responses:
        "201":
          description: The new reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reply" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}/replies/{replyId}:
    delete:
      summary: Delete a reply (mine, or any on my post)
      parameters:
        - { $ref: "#/components/parameters/PostId" }
        - { name: replyId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}/replies/{replyId}/like:
    put:
      summary: Like a reply
      parameters:
        - { $ref: "#/components/parameters/PostId" }
        - { name: replyId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Unlike a reply
      parameters:
        - { $ref: "#/components/parameters/PostId" }
        - { name: replyId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}/like:
    put:
      summary: Like
      parameters:
        - { $ref: "#/components/parameters/PostId" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Unlike
      parameters:
        - { $ref: "#/components/parameters/PostId" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}/likes:
    get:
      summary: Who liked a post
      parameters:
        - { $ref: "#/components/parameters/PostId" }
      responses:
        "200":
          description: Likers, oldest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Person" } }
        "404": { $ref: "#/components/responses/Error" }

  # ---------------- activity ----------------
  /v1/activity:
    get:
      summary: Replies and likes on my posts, and likes on my replies, newest first
      parameters:
        - { $ref: "#/components/parameters/Before" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [kind, postId, postText, actorId, actor, createdAt]
                      properties:
                        kind: { type: string, enum: [reply, like, reply_like] }
                        postId: { $ref: "#/components/schemas/Id" }
                        postText: { type: string }
                        actorId: { $ref: "#/components/schemas/Id" }
                        actor: { $ref: "#/components/schemas/Person" }
                        replyId: { type: [string, "null"], format: uuid }
                        replyText: { type: [string, "null"] }
                        createdAt: { type: string, format: date-time }
  /v1/activity/pending:
    get:
      summary: Counts of new activity since a time (background checks; authenticated by the check token)
      security: []
      parameters:
        - { name: since, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: X-Circlo-Check-Token, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                type: object
                required: [requests, replies, likes, messages, signIns]
                properties:
                  requests: { type: integer }
                  replies: { type: integer }
                  likes: { type: integer }
                  messages: { type: integer }
                  signIns: { type: integer }
        "401": { $ref: "#/components/responses/Error" }

  # ---------------- chats ----------------
  /v1/chats:
    get:
      summary: My chats, most recent first
      responses:
        "200":
          description: Chats
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Chat" } }
    post:
      summary: Start a chat with friends (a 1:1 chat that exists already is reused)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds: { type: array, items: { $ref: "#/components/schemas/Id" } }
                name: { type: string }
      responses:
        "201":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/chats/{chatId}:
    get:
      summary: One chat
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      responses:
        "200":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/chats/{chatId}/members:
    post:
      summary: Add friends to a chat
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties: { userIds: { type: array, items: { $ref: "#/components/schemas/Id" } } }
      responses:
        "200":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/chats/{chatId}/members/{userId}:
    delete:
      summary: Remove someone from a chat, or leave it (my own id)
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/chats/{chatId}/messages:
    get:
      summary: Messages after `after`, or the latest page before `before` (both oldest first)
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
        - { name: after, in: query, schema: { type: integer, format: int64 } }
        - { name: before, in: query, schema: { type: integer, format: int64 } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Message" } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Send a message
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                media: { type: array, items: { $ref: "#/components/schemas/NewAttachment" } }
      responses:
        "201":
          description: The message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/chats/{chatId}/messages/{messageId}:
    delete:
      summary: Delete one of my messages for everyone
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
        - { name: messageId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/chats/{chatId}/read:
    post:
      summary: Mark messages up to `seq` as read
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [seq], properties: { seq: { type: integer, format: int64 } } }
      responses:
        "200": { $ref: "#/components/responses/Status" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Before: { name: before, in: query, schema: { type: string, format: date-time } }
    Limit: { name: limit, in: query, schema: { type: integer } }
    PostId: { name: postId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    ChatId: { name: chatId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
  requestBodies:
    Email:
      required: true
      content:
        application/json:
          schema: { type: object, required: [email], properties: { email: { type: string } } }
    CircleName:
      required: true
      content:
        application/json:
          schema: { type: object, required: [name], properties: { name: { type: string, description: "1-40 characters" } } }
  responses:
    Error:
      description: A fixed error code, plus fixed details for some codes
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
              attemptsLeft: { type: integer }
              lockSeconds: { type: integer }
              retryAfter: { type: integer }
              email: { type: string }
    Status:
      description: OK
      content:
        application/json:
          schema: { type: object, properties: { status: { type: string } } }
    Tokens:
      description: A signed-in session for one device
      content:
        application/json:
          schema:
            type: object
            required: [userId, deviceId, accessToken, refreshToken, expiresIn]
            properties:
              userId: { $ref: "#/components/schemas/Id" }
              deviceId: { $ref: "#/components/schemas/Id" }
              accessToken: { type: string }
              refreshToken: { type: string }
              expiresIn: { type: integer }
    Me:
      description: My account
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Me" }
    Posts:
      description: Posts, newest first
      content:
        application/json:
          schema: { type: array, items: { $ref: "#/components/schemas/Post" } }
  schemas:
    Id: { type: string, format: uuid }
    ObjectKey: { type: string, pattern: "^[0-9a-f]{64}$" }
    Me:
      type: object
      required: [userId, name, username, email, bio, createdAt]
      properties:
        userId: { $ref: "#/components/schemas/Id" }
        name: { type: [string, "null"], description: "Null until I set one" }
        username: { type: string }
        email: { type: string }
        bio: { type: string }
        avatarUrl: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    Person:
      description: Someone as shown next to their posts, replies and messages (never their email)
      type: object
      required: [userId, name, username]
      properties:
        userId: { $ref: "#/components/schemas/Id" }
        name: { type: string, description: "Their name, or their username while they haven't set one" }
        username: { type: string }
        avatarUrl: { type: [string, "null"] }
    Circle:
      type: object
      required: [id, name, members]
      properties:
        id: { type: integer, minimum: 1, maximum: 8 }
        name: { type: string }
        members: { type: array, items: { $ref: "#/components/schemas/Id" } }
    Audience:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [onlyMe, everyone, circles] }
        circles: { type: array, items: { type: integer } }
    NewAttachment:
      description: A photo (with its thumbnail) or a video (with its poster frame), both uploaded first
      type: object
      required: [type, objectKey, previewKey, width, height, durationMs]
      properties:
        type: { type: string, enum: [image, video] }
        objectKey: { $ref: "#/components/schemas/ObjectKey" }
        previewKey: { $ref: "#/components/schemas/ObjectKey" }
        width: { type: integer }
        height: { type: integer }
        durationMs: { type: integer }
    Attachment:
      type: object
      required: [type, mime, width, height, durationMs, objectKey, url, previewKey, previewUrl]
      properties:
        type: { type: string, enum: [image, video] }
        mime: { type: string }
        width: { type: integer }
        height: { type: integer }
        durationMs: { type: integer }
        objectKey: { $ref: "#/components/schemas/ObjectKey" }
        url: { type: string, description: "Presigned GET URL (1 hour)" }
        previewKey: { $ref: "#/components/schemas/ObjectKey" }
        previewUrl: { type: string }
    Post:
      type: object
      required: [postId, authorId, author, text, createdAt, media, replyCount, likeCount, likedByMe]
      properties:
        postId: { $ref: "#/components/schemas/Id" }
        authorId: { $ref: "#/components/schemas/Id" }
        author: { $ref: "#/components/schemas/Person" }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        media: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
        replyCount: { type: integer }
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        audience:
          description: Only on my own posts
          oneOf:
            - { $ref: "#/components/schemas/Audience" }
            - { type: "null" }
    Reply:
      type: object
      required: [replyId, authorId, author, text, createdAt, likeCount, likedByMe]
      properties:
        replyId: { $ref: "#/components/schemas/Id" }
        authorId: { $ref: "#/components/schemas/Id" }
        author: { $ref: "#/components/schemas/Person" }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        likeCount: { type: integer }
        likedByMe: { type: boolean }
    Message:
      type: object
      required: [seq, messageId, senderId, text, media, createdAt]
      properties:
        seq: { type: integer, format: int64 }
        messageId: { $ref: "#/components/schemas/Id" }
        senderId: { $ref: "#/components/schemas/Id" }
        text: { type: string }
        media: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
        createdAt: { type: string, format: date-time }
    Chat:
      type: object
      required: [chatId, members, unread, readSeq, updatedAt]
      properties:
        chatId: { $ref: "#/components/schemas/Id" }
        name: { type: [string, "null"] }
        members: { type: array, items: { $ref: "#/components/schemas/Person" } }
        lastMessage:
          oneOf:
            - { $ref: "#/components/schemas/Message" }
            - { type: "null" }
        unread: { type: integer }
        readSeq: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
