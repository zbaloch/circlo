openapi: 3.1.0
info:
  title: Circlo API
  version: 1.0.0
  description: >
    circlo-server API, used by the iOS and Android apps and the web app (app.hellocirclo.com). Requests go over HTTPS;
    content is stored as sent and the server decides who may see it. IDs are UUID strings; times are ISO-8601 instants.
    Errors are `{"error": "<code>"}` (plus fixed details such as `attemptsLeft`) and never echo request data.
    Photos and videos go straight between the app and storage through short-lived presigned URLs.
servers:
  - url: http://localhost:8080
security:
  - bearer: []

paths:
  # ---------------- auth ----------------
  /v1/auth/signup:
    post:
      summary: Start a signup; emails a 6-digit code to verify the address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string, description: "3-30 of [a-z0-9_], case-insensitive" }
                email: { type: string }
                password: { type: string, description: "12-128 characters" }
      responses:
        "201":
          description: Code sent
          content:
            application/json:
              schema: { type: object, required: [email], properties: { email: { type: string } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/signup/resend:
    post:
      summary: Send a new code for an unfinished signup (says nothing about whether one exists)
      security: []
      requestBody: { $ref: "#/components/requestBodies/Email" }
      responses:
        "202": { $ref: "#/components/responses/Status" }
  /v1/auth/signup/verify:
    post:
      summary: Finish a signup with the emailed code; signs this device in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties: { email: { type: string }, code: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/auth/login:
    post:
      summary: Log in with a username or email and password
      description: >
        401 carries `attemptsLeft` (and `lockSeconds` when this failure set a lock); 429 `locked` carries `retryAfter`.
        An account whose email isn't verified yet answers 403 `email_not_verified` with `email`, and gets a fresh code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string }
                password: { type: string }
                emailCode:
                  type: boolean
                  description: >-
                    true from apps that do the emailed-code step (1.1.0 on): the right password emails a 6-digit code
                    and answers 202. Apps already in the stores omit it and are signed in at once (200), unless the
                    server sets CIRCLO_LOGIN_CODE_FOR_OLD_APPS.
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "202":
          description: The right password; a sign-in code was emailed (nothing is signed in yet)
          content:
            application/json:
              schema:
                type: object
                required: [status, email, challenge]
                properties:
                  status: { type: string, enum: [code_sent] }
                  email: { type: string, description: "Where it went, partly hidden: z•••@hey.com" }
                  challenge: { type: string, description: "This attempt's one-time challenge, for /login/verify and /login/resend" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/login/verify:
    post:
      summary: Finish signing in with the emailed code and the attempt's challenge; signs this device in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, challenge, code]
              properties: { login: { type: string }, challenge: { type: string }, code: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/auth/login/resend:
    post:
      summary: A new sign-in code for the same attempt (says nothing about whether one was sent)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, challenge]
              properties: { login: { type: string }, challenge: { type: string } }
      responses:
        "202": { $ref: "#/components/responses/Status" }
  /v1/auth/refresh:
    post:
      summary: Rotate the refresh token (single use; reusing an old one signs out every device)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/auth/password/forgot:
    post:
      summary: Email a password-reset code (says nothing about whether the account exists)
      security: []
      requestBody: { $ref: "#/components/requestBodies/Email" }
      responses:
        "202": { $ref: "#/components/responses/Status" }
  /v1/auth/password/reset:
    post:
      summary: Set a new password with the emailed code; signs out every device and signs this one in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password]
              properties: { email: { type: string }, code: { type: string }, password: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/auth/password/change:
    post:
      summary: Change the password (signed in); other devices are signed out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties: { currentPassword: { type: string }, newPassword: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/logout:
    post:
      summary: Sign this device out
      responses:
        "200": { $ref: "#/components/responses/Status" }

  # ---------------- my account ----------------
  /v1/me:
    get:
      summary: My account
      responses:
        "200": { $ref: "#/components/responses/Me" }
  /v1/me/profile:
    put:
      summary: Change my name and bio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, bio]
              properties: { name: { type: string, description: "1-50 characters; empty clears it" }, bio: { type: string, description: "Up to 160 characters" } }
      responses:
        "200": { $ref: "#/components/responses/Me" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/me/notifications:
    put:
      summary: >-
        The daily email on or off, the hour (UTC) the daily note comes at, and which pushes my phones get (account
        settings, for all my phones; security alerts ignore them). Any may be left out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: boolean }
                digestHour: { type: integer, minimum: 0, maximum: 23 }
                pushMessages: { type: boolean }
                pushReplies: { type: boolean }
                pushFriends: { type: boolean }
                pushDaily: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Me" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/me/privacy:
    put:
      summary: Whether people in the same circles as me see me on that friend's profile (and may ask to connect)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [showInCircles]
              properties:
                showInCircles: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Me" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/email/unsubscribe:
    parameters:
      - { name: u, in: query, required: true, schema: { $ref: "#/components/schemas/Id" } }
      - { name: t, in: query, required: true, schema: { type: string } }
    get:
      summary: The unsubscribe link in notification emails (public, signed). Shows a page with one button
      security: []
      responses:
        "200": { description: An HTML page, content: { text/html: { schema: { type: string } } } }
        "404": { description: Not a genuine link, content: { text/html: { schema: { type: string } } } }
    post:
      summary: Turn notification emails off (the page's button, or a mail app's one-click unsubscribe, RFC 8058)
      security: []
      responses:
        "200": { description: An HTML page, content: { text/html: { schema: { type: string } } } }
        "404": { description: Not a genuine link, content: { text/html: { schema: { type: string } } } }
  /v1/me/avatar:
    put:
      summary: Set my photo to an image I just uploaded
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [objectKey], properties: { objectKey: { $ref: "#/components/schemas/ObjectKey" } } }
      responses:
        "200": { $ref: "#/components/responses/Me" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove my photo
      responses:
        "200": { $ref: "#/components/responses/Me" }
  /v1/me/export:
    get:
      summary: A copy of my data (profile, circles, friends, posts, replies, chats, reading sources) as JSON
      responses:
        "200":
          description: My data
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /v1/me/storage:
    get:
      summary: >-
        How much storage my account uses: the photos and videos on my posts and chat messages (with their thumbnails
        and poster frames, counted as photos) and my profile photo
      responses:
        "200":
          description: Storage used, in bytes, and how many photos and videos
          content:
            application/json:
              schema:
                type: object
                required: [usedBytes, photoBytes, videoBytes, profilePhotoBytes, photos, videos]
                properties:
                  usedBytes: { type: integer, format: int64 }
                  photoBytes: { type: integer, format: int64 }
                  videoBytes: { type: integer, format: int64 }
                  profilePhotoBytes: { type: integer, format: int64 }
                  photos: { type: integer, format: int64 }
                  videos: { type: integer, format: int64 }
  /v1/me/preview/{friendId}:
    get:
      summary: My posts exactly as this friend sees them
      parameters:
        - { name: friendId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { $ref: "#/components/parameters/Before" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { $ref: "#/components/responses/Posts" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/account:
    delete:
      summary: Delete my account and everything in it (needs my password)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [password], properties: { password: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/devices:
    get:
      summary: The devices and browsers signed in to my account
      responses:
        "200":
          description: Devices, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [deviceId, createdAt, current, kind]
                  properties:
                    deviceId: { $ref: "#/components/schemas/Id" }
                    createdAt: { type: string, format: date-time }
                    current: { type: boolean }
                    kind: { type: [string, "null"], enum: [ios, android, web, null], description: "Null for a sign-in from before this was recorded" }
  /v1/devices/{deviceId}:
    delete:
      summary: Sign a device out
      parameters:
        - { name: deviceId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/devices/current:
    put:
      summary: Say which kind of app this sign-in is (only this; it decides push or email for activity)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [kind], properties: { kind: { type: string, enum: [ios, android, web] } } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/devices/current/push-token:
    put:
      summary: Register this device's push token (content-free pushes; forgotten on sign-out or revoke)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, service]
              properties:
                token: { type: string }
                service: { type: string, enum: [apns, apns_sandbox, fcm] }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      summary: Stop pushes to this device
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /v1/push/test:
    post:
      summary: >-
        Send a test notification ("This is a test notification from Circlo.", data {type: test}) to all my phones.
        For checking push end to end, e.g. with curl. At most 10 an hour.
      responses:
        "200":
          description: Whether each provider has credentials, and what happened on each of my phones
          content:
            application/json:
              schema:
                type: object
                required: [apns, fcm, phones]
                properties:
                  apns: { type: string, enum: ["on", "off"] }
                  fcm: { type: string, enum: ["on", "off"] }
                  phones:
                    type: array
                    items:
                      type: object
                      required: [deviceId, kind, result]
                      properties:
                        deviceId: { type: string, format: uuid }
                        kind: { type: string, enum: [ios, android] }
                        result:
                          type: string
                          description: >-
                            sent; unregistered (Apple or Google say the app is gone, it registers again on its next
                            launch); failed (the server log says why); notifications_off; provider_off (no credentials)
                          enum: [sent, unregistered, failed, notifications_off, provider_off]
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/events:
    get:
      summary: Live updates. Answers with my version as soon as it differs from `since` (at once if it already does), else after 25 s
      parameters:
        - { name: since, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: My current version; the app refreshes what it shows when it changes
          content:
            application/json:
              schema: { type: object, required: [version], properties: { version: { type: integer, format: int64 } } }
  /v1/devices/current/check-token:
    post:
      summary: Turn on background checks for this device; returns its check token
      responses:
        "200":
          description: The check token
          content:
            application/json:
              schema: { type: object, required: [token], properties: { token: { type: string } } }
    delete:
      summary: Turn background checks off for this device
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /v1/security-events:
    get:
      summary: Recent sign-ins to my account (30 days, newest first)
      responses:
        "200":
          description: Sign-ins
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      required: [id, kind, createdAt]
                      properties:
                        id: { $ref: "#/components/schemas/Id" }
                        kind: { type: string, enum: [sign_in] }
                        createdAt: { type: string, format: date-time }

  # ---------------- people ----------------
  /v1/users/{userId}:
    get:
      summary: Someone's profile (mine, or someone I'm connected with)
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: Their profile
          content:
            application/json:
              schema:
                type: object
                required: [userId, name, username, bio, relation, friendCount]
                properties:
                  userId: { $ref: "#/components/schemas/Id" }
                  name: { type: string }
                  username: { type: string }
                  bio: { type: string }
                  avatarUrl: { type: [string, "null"] }
                  relation: { type: string, enum: [me, accepted, incoming, outgoing] }
                  friendCount: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
  /v1/users/{userId}/circle-mates:
    get:
      summary: >-
        The people I see on a friend's profile: the others in their circles that I'm in too, where they switched it on.
        One list sorted by name, never which circle. Empty for my own profile
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: Circle mates
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CircleMate" } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/me/people-you-may-know:
    get:
      summary: >-
        Home's "People you may know": the circle mates on all my friends' profiles that I have no connection or request
        with yet, grouped by the friend I'd know them through. Friends and people sorted by name; never which circle
      responses:
        "200":
          description: One group per friend with anyone left
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [owner, people]
                  properties:
                    owner: { $ref: "#/components/schemas/Person" }
                    people: { type: array, items: { $ref: "#/components/schemas/Person" } }
  /v1/me/preview/{friendId}/circle-mates:
    get:
      summary: The people this friend sees on my profile (relation is always null here)
      parameters:
        - { name: friendId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: Circle mates as they see them
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CircleMate" } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/users/{userId}/posts:
    get:
      summary: Someone's posts that I may see, newest first
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { $ref: "#/components/parameters/Before" }
        - { $ref: "#/components/parameters/Limit" }
        - name: audience
          in: query
          required: false
          description: My own posts only (refused with 400 invalid_audience on anyone else's), just those shared with Only me (onlyMe), Everyone (everyone) or one of my circles (its id).
          schema: { type: string, pattern: '^(onlyMe|everyone|[0-9]{1,9})$' }
      responses:
        "200": { $ref: "#/components/responses/Posts" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/users/{userId}/replies:
    get:
      summary: Someone's replies on posts I may see, newest first, each with its post
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { $ref: "#/components/parameters/Before" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Replies with their posts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [reply, post]
                  properties:
                    reply: { $ref: "#/components/schemas/Reply" }
                    post: { $ref: "#/components/schemas/Post" }
  /v1/invites/link:
    get:
      summary: My invite link (the same until I reset it; made the first time I ask)
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteLink" }
  /v1/invites/link/reset:
    post:
      summary: A new invite link; the old one and its QR code stop working (people who joined stay connected)
      responses:
        "200":
          description: The new link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteLink" }
  /v1/invites/preview:
    post:
      summary: Who an invite is from (changes nothing)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "200":
          description: Who it's from
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/invites/{token}/card:
    get:
      summary: >-
        What a shared invite link's preview shows (the website's /i/<token> page, for WhatsApp, iMessage and the like):
        its owner's name and photo, nothing else. Public; 404 unless it's a current link or an unused invite
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The inviter, as their link's preview shows them
          content:
            application/json:
              schema:
                type: object
                required: [name, avatarUrl]
                properties:
                  name: { type: string, description: "Their name, or their username while they haven't set one" }
                  avatarUrl: { type: [string, "null"], description: "Presigned GET URL (1 hour)" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/admin/growth:
    get:
      summary: >-
        Admins only (CIRCLO_ADMIN_EMAILS; 404 for anyone else): per UTC day for the last 30 days, newest first, how many
        people signed up, joined through an invite, connected, posted and replied, plus running totals. Counts only
      responses:
        "200":
          description: Daily totals
          content:
            application/json:
              schema:
                type: object
                required: [days, totals]
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      required: [date, signups, inviteJoins, connections, posts, replies]
                      properties:
                        date: { type: string, format: date }
                        signups: { type: integer }
                        inviteJoins: { type: integer, description: "One-time invites used and invite links opened" }
                        connections: { type: integer, description: "Friendships made (requests accepted, links opened)" }
                        posts: { type: integer }
                        replies: { type: integer }
                  totals:
                    type: object
                    required: [people, connections, posts]
                    properties:
                      people: { type: integer }
                      connections: { type: integer }
                      posts: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
  /v1/invites/join:
    post:
      summary: >-
        Use an invite, putting its owner in my circles. Someone's link connects at once (status accepted) and they're
        told; a one-time invite sends a request (status outgoing).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                circles: { type: array, items: { type: integer } }
      responses:
        "200":
          description: Connected, or the request sent
          content:
            application/json:
              schema:
                type: object
                required: [userId, status]
                properties:
                  userId: { $ref: "#/components/schemas/Id" }
                  status: { type: string, enum: [accepted, outgoing] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/invites:
    post:
      summary: A single-use invite link (7 days); for older apps
      responses:
        "201":
          description: The invite
          content:
            application/json:
              schema:
                type: object
                required: [token, link, expiresAt]
                properties:
                  token: { type: string }
                  link: { type: string }
                  expiresAt: { type: string, format: date-time }
        "409": { $ref: "#/components/responses/Error" }
  /v1/invites/redeem:
    post:
      summary: Use an invite; returns who sent it (for older apps; someone's link connects here already)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "200":
          description: Who sent it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/friends:
    get:
      summary: My friends and pending requests (with the circles I put each one in)
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [userId, status, since, name, username, circles]
                  properties:
                    userId: { $ref: "#/components/schemas/Id" }
                    status: { type: string, enum: [accepted, incoming, outgoing] }
                    since: { type: string, format: date-time }
                    name: { type: string }
                    username: { type: string }
                    bio: { type: string, description: "As on their profile; empty when they haven't written one" }
                    avatarUrl: { type: [string, "null"] }
                    circles: { type: array, items: { type: integer } }
  /v1/friends/requests:
    post:
      summary: Ask someone whose invite I redeemed, or someone I see among a friend's circle mates, to connect, putting them in my circles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toUserId]
              properties:
                toUserId: { $ref: "#/components/schemas/Id" }
                circles: { type: array, items: { type: integer } }
      responses:
        "201": { $ref: "#/components/responses/Status" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/friends/{userId}:
    delete:
      summary: Unfriend (or cancel my request)
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/friends/{userId}/accept:
    post:
      summary: Accept a request, putting them in my circles
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { circles: { type: array, items: { type: integer } } } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/friends/{userId}/decline:
    post:
      summary: Decline a request
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/friends/{userId}/circles:
    put:
      summary: Set which of my circles they're in (silent)
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [circles], properties: { circles: { type: array, items: { type: integer } } } }
      responses:
        "200":
          description: The circles they're in now
          content:
            application/json:
              schema: { type: object, required: [circles], properties: { circles: { type: array, items: { type: integer } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/circles:
    get:
      summary: My circles with their members (only ever shown to me)
      responses:
        "200":
          description: My circles
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Circle" } }
    post:
      summary: Add a circle (up to 8)
      requestBody: { $ref: "#/components/requestBodies/CircleName" }
      responses:
        "201":
          description: The new circle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Circle" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/circles/{id}:
    put:
      summary: Rename a circle
      description: >-
        The starter circles (Family, Close Friends, School, Work and Acquaintances) keep their names, and no circle can be renamed to one of them
        (`fixed_circle_name`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody: { $ref: "#/components/requestBodies/CircleName" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a circle (posts already shared with it keep their audience)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/circles/{id}/members-visible:
    put:
      summary: Whether the people in my circle see each other on my profile (never its name). Nobody is told
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [visible], properties: { visible: { type: boolean } } }
      responses:
        "200":
          description: The switch as it is now
          content:
            application/json:
              schema: { type: object, required: [membersVisible], properties: { membersVisible: { type: boolean } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/blocks:
    get:
      summary: People I blocked
      responses:
        "200":
          description: Blocked people, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [userId, name, username, createdAt]
                  properties:
                    userId: { $ref: "#/components/schemas/Id" }
                    name: { type: string }
                    username: { type: string }
                    createdAt: { type: string, format: date-time }
  /v1/blocks/{userId}:
    post:
      summary: Block someone (ends any connection)
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Unblock
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /v1/reports:
    post:
      summary: Report a post, person or chat message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, targetId, reason]
              properties:
                kind: { type: string, enum: [post, user, message, reply] }
                targetId: { $ref: "#/components/schemas/Id" }
                reason: { type: string }
                note: { type: string }
      responses:
        "201": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }

  # ---------------- media ----------------
  /v1/media/uploads:
    post:
      summary: Upload slots (presigned PUT URLs locked to each size and type, 15 minutes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: object
                    required: [size, mime]
                    properties:
                      size: { type: integer, format: int64 }
                      mime: { type: string, enum: [image/jpeg, image/png, image/webp, video/mp4, video/quicktime, video/webm] }
      responses:
        "200":
          description: One slot per file, in order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [objectKey, putUrl, size, mime]
                  properties:
                    objectKey: { $ref: "#/components/schemas/ObjectKey" }
                    putUrl: { type: string }
                    size: { type: integer, format: int64 }
                    mime: { type: string }
        "400": { $ref: "#/components/responses/Error" }

  # ---------------- posts ----------------
  /v1/feed:
    get:
      summary: My posts and my friends' posts that I may see, newest first
      parameters:
        - { $ref: "#/components/parameters/Before" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { $ref: "#/components/responses/Posts" }
  /v1/posts:
    post:
      summary: Create a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, audience]
              properties:
                text: { type: string, description: "Up to 1,500 characters; may be empty with media" }
                audience: { $ref: "#/components/schemas/Audience" }
                media: { type: array, items: { $ref: "#/components/schemas/NewAttachment" } }
      responses:
        "201":
          description: The new post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}:
    get:
      summary: One post I may see
      parameters:
        - { $ref: "#/components/parameters/PostId" }
      responses:
        "200":
          description: The post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete my post
      parameters:
        - { $ref: "#/components/parameters/PostId" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}/audience:
    put:
      summary: Change who can see my post (at once; nobody is told). 404 for anyone but the author
      parameters:
        - { $ref: "#/components/parameters/PostId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Audience" }
      responses:
        "200":
          description: The post, with its new audience
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}/replies:
    get:
      summary: Replies, oldest first
      parameters:
        - { $ref: "#/components/parameters/PostId" }
        - { name: after, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Replies
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Reply" } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Reply, to the post or (with parentId) to one of its replies I can see; an answer stays in that reply's circle
      parameters:
        - { $ref: "#/components/parameters/PostId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                parentId: { $ref: "#/components/schemas/Id" }
      responses:
        "201":
          description: The new reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reply" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}/replies/{replyId}:
    delete:
      summary: Delete a reply (mine, or any on my post)
      parameters:
        - { $ref: "#/components/parameters/PostId" }
        - { name: replyId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}/replies/{replyId}/like:
    put:
      summary: Like a reply
      parameters:
        - { $ref: "#/components/parameters/PostId" }
        - { name: replyId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Unlike a reply
      parameters:
        - { $ref: "#/components/parameters/PostId" }
        - { name: replyId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}/like:
    put:
      summary: Like
      parameters:
        - { $ref: "#/components/parameters/PostId" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Unlike
      parameters:
        - { $ref: "#/components/parameters/PostId" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}/likes:
    get:
      summary: Who liked a post
      parameters:
        - { $ref: "#/components/parameters/PostId" }
      responses:
        "200":
          description: Likers, oldest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Person" } }
        "404": { $ref: "#/components/responses/Error" }

  # ---------------- activity ----------------
  /v1/activity:
    get:
      summary: Replies and likes on my posts, likes on my replies, and people who joined with my link, newest first
      parameters:
        - { $ref: "#/components/parameters/Before" }
        - { $ref: "#/components/parameters/Limit" }
        - name: replies
          in: query
          description: "all: also the newer kinds, answers to my replies on other people's posts (reply_reply) and my requests that were accepted (accepted)"
          schema: { type: string, enum: [all] }
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [kind, postId, postText, actorId, actor, createdAt]
                      properties:
                        kind: { type: string, enum: [reply, like, reply_like, reply_reply, joined, accepted] }
                        postId: { type: [string, "null"], format: uuid }
                        postText: { type: [string, "null"] }
                        actorId: { $ref: "#/components/schemas/Id" }
                        actor: { $ref: "#/components/schemas/Person" }
                        replyId: { type: [string, "null"], format: uuid }
                        replyText: { type: [string, "null"] }
                        createdAt: { type: string, format: date-time }
  /v1/activity/pending:
    get:
      summary: Counts of new activity since a time (background checks; authenticated by the check token)
      security: []
      parameters:
        - { name: since, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: X-Circlo-Check-Token, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                type: object
                required: [requests, replies, likes, messages, signIns]
                properties:
                  requests: { type: integer }
                  replies: { type: integer }
                  likes: { type: integer }
                  messages: { type: integer }
                  signIns: { type: integer }
        "401": { $ref: "#/components/responses/Error" }

  # ---------------- chats ----------------
  /v1/chats:
    get:
      summary: My chats, most recent first
      responses:
        "200":
          description: Chats
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Chat" } }
    post:
      summary: Start a chat with friends (a 1:1 chat that exists already is reused)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds: { type: array, items: { $ref: "#/components/schemas/Id" } }
                name: { type: string }
      responses:
        "201":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/chats/{chatId}:
    get:
      summary: One chat
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      responses:
        "200":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/chats/{chatId}/members:
    post:
      summary: Add friends to a chat
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties: { userIds: { type: array, items: { $ref: "#/components/schemas/Id" } } }
      responses:
        "200":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/chats/{chatId}/members/{userId}:
    delete:
      summary: Remove someone from a chat, or leave it (my own id)
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/chats/{chatId}/messages:
    get:
      summary: Messages after `after`, or the latest page before `before` (both oldest first)
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
        - { name: after, in: query, schema: { type: integer, format: int64 } }
        - { name: before, in: query, schema: { type: integer, format: int64 } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Message" } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Send a message
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                media: { type: array, items: { $ref: "#/components/schemas/NewAttachment" } }
                replyTo:
                  description: A message in this chat that this one replies to (`invalid_reply` otherwise)
                  allOf: [{ $ref: "#/components/schemas/Id" }]
      responses:
        "201":
          description: The message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/chats/{chatId}/messages/{messageId}:
    delete:
      summary: Delete one of my messages for everyone
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
        - { name: messageId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/chats/{chatId}/read:
    post:
      summary: Mark messages up to `seq` as read
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [seq], properties: { seq: { type: integer, format: int64 } } }
      responses:
        "200": { $ref: "#/components/responses/Status" }

  # ---------------- reading (2.0) ----------------
  # Web feeds I follow. Circlo fetches each feed once for everyone who follows it and keeps titles, plain-text
  # summaries and links; articles are read on their own site. What I follow is returned only to me.
  /v1/reading/sources/find:
    post:
      summary: >-
        What's at an address (a site or its feed): the feed's name and its three latest articles, before following it.
        Follows nothing. Finding and following fetch other sites, so they're limited to 60 an hour per person
      requestBody: { $ref: "#/components/requestBodies/SourceUrl" }
      responses:
        "200":
          description: The feed found there
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FoundSource" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/reading/sources:
    get:
      summary: The feeds I follow, by name. Only ever my own
      responses:
        "200":
          description: My sources
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReadingSource" } }
    post:
      summary: >-
        Follow the feed at an address (find's feedUrl, or a site). Following one I already follow is fine. Errors:
        invalid_url (400), too_many_sources (409, 200 at most), no_feed (422: it answered, but no feed there), unreachable (422: the site didn't answer at all), rate_limited (429)
      requestBody: { $ref: "#/components/requestBodies/SourceUrl" }
      responses:
        "201":
          description: The source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadingSource" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/reading/sources/{sourceId}:
    delete:
      summary: Stop following a source
      parameters:
        - { name: sourceId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "204": { description: Unfollowed }
        "404": { $ref: "#/components/responses/Error" }
  /v1/reading/articles:
    get:
      summary: Articles from the feeds I follow (or one of them), newest first. Page with `before` set to the last page's `next`
      parameters:
        - { name: source, in: query, required: false, schema: { $ref: "#/components/schemas/Id" } }
        - { name: unread, in: query, required: false, schema: { type: boolean } }
        - { name: before, in: query, required: false, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of articles
          content:
            application/json:
              schema:
                type: object
                required: [articles, next]
                properties:
                  articles: { type: array, items: { $ref: "#/components/schemas/ReadingArticle" } }
                  next: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/Error" }
  /v1/reading/articles/{articleId}:
    get:
      summary: >-
        One article with its content as blocks, for reading in Circlo (when hasContent). Images are signed Circlo links
        (relative paths; put the API address in front), so the publisher never sees the reader. 404 unless I follow its source
      parameters:
        - { name: articleId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: The article and its content
          content:
            application/json:
              schema:
                type: object
                required: [article, content]
                properties:
                  article: { $ref: "#/components/schemas/ReadingArticle" }
                  content: { type: array, items: { $ref: "#/components/schemas/ContentBlock" } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/reading/image:
    get:
      summary: >-
        An article image, fetched by Circlo. Signed-out (an <img> can't send a token): the signed link from an article is
        the permission. JPEG, PNG, GIF, WebP or AVIF only; 404 for anything else, a wrong or expired signature, or a failed fetch
      security: []
      parameters:
        - { name: u, in: query, required: true, schema: { type: string } }
        - { name: e, in: query, required: true, schema: { type: string } }
        - { name: s, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The image
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
  /v1/reading/articles/{articleId}/read:
    put:
      summary: Mark an article read
      parameters:
        - { name: articleId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "204": { description: Read }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Mark an article unread
      parameters:
        - { name: articleId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "204": { description: Unread }
        "404": { $ref: "#/components/responses/Error" }
  /v1/reading/read-all:
    post:
      summary: Mark every article read, or every article of one source
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { sourceId: { $ref: "#/components/schemas/Id" } } }
      responses:
        "204": { description: Read }
  /v1/reading/status:
    get:
      summary: Whether there's something new since I last opened Reading (the drawer's dot)
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { type: object, required: [hasNew], properties: { hasNew: { type: boolean } } }
  /v1/reading/seen:
    put:
      summary: I opened Reading; the dot goes until something new arrives
      responses:
        "204": { description: Seen }
  /v1/reading/import:
    post:
      summary: >-
        Follow the feeds in an OPML file from another reader (up to 200 sources in all). They're read by the next check;
        one that doesn't work shows as failing
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [opml], properties: { opml: { type: string, maxLength: 1000000 } } }
      responses:
        "200":
          description: How many were added, and how many couldn't be
          content:
            application/json:
              schema: { type: object, required: [added, skipped], properties: { added: { type: integer }, skipped: { type: integer } } }
  /v1/reading/export:
    get:
      summary: What I follow, as an OPML file another reader can import
      responses:
        "200":
          description: OPML
          content:
            text/x-opml:
              schema: { type: string }

  /v1/todos:
    get:
      summary: My to-do lists (in my order; General is made on first use) and my open to-dos (by list, then my order)
      responses:
        "200":
          description: Lists and open to-dos
          content:
            application/json:
              schema:
                type: object
                required: [lists, todos]
                properties:
                  lists: { type: array, items: { $ref: "#/components/schemas/TodoList" } }
                  todos: { type: array, items: { $ref: "#/components/schemas/Todo" } }
    post:
      summary: Add a to-do (to General when listId is left out), at the end of its list. Errors invalid_title (400), too_many_todos (409, 5,000 open)
      requestBody: { $ref: "#/components/requestBodies/TodoBody" }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/Todo" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/todos/{todoId}:
    put:
      summary: Change a to-do's title and list (a new list puts it at that list's end)
      parameters:
        - { name: todoId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      requestBody: { $ref: "#/components/requestBodies/TodoBody" }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Todo" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a to-do
      parameters:
        - { name: todoId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /v1/todos/{todoId}/complete:
    post:
      summary: Tick a to-do (it goes to Completed)
      parameters:
        - { name: todoId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { description: Ticked, content: { application/json: { schema: { $ref: "#/components/schemas/Todo" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/todos/{todoId}/notes:
    get:
      summary: A to-do's notes, oldest first (newest at the bottom, like a conversation)
      parameters:
        - { name: todoId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: Its notes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TodoNote" } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Add a note, stamped now. Errors invalid_note (400), too_many_notes (409, 500)
      parameters:
        - { name: todoId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string, maxLength: 10000 } } }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/TodoNote" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/todos/{todoId}/notes/{noteId}:
    delete:
      summary: Delete a note
      parameters:
        - { name: todoId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { name: noteId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /v1/todos/{todoId}/reopen:
    post:
      summary: Untick a to-do (back to the end of its list)
      parameters:
        - { name: todoId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { description: Open again, content: { application/json: { schema: { $ref: "#/components/schemas/Todo" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/todos/lists:
    post:
      summary: Add a list (at the end). Errors invalid_name (400), too_many_lists (409, 100)
      requestBody: { $ref: "#/components/requestBodies/ListName" }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/TodoList" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/todos/lists/order:
    put:
      summary: My lists in this order
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [listIds], properties: { listIds: { type: array, items: { $ref: "#/components/schemas/Id" } } } }
      responses:
        "204": { description: Ordered }
  /v1/todos/lists/{listId}:
    put:
      summary: Rename a list (General too)
      parameters:
        - { name: listId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      requestBody: { $ref: "#/components/requestBodies/ListName" }
      responses:
        "200": { description: Renamed, content: { application/json: { schema: { $ref: "#/components/schemas/TodoList" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a list and its to-dos. General can't be deleted (409 general_list)
      parameters:
        - { name: listId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/todos/lists/{listId}/order:
    put:
      summary: The open to-dos in a list, in this order
      parameters:
        - { name: listId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [todoIds], properties: { todoIds: { type: array, items: { $ref: "#/components/schemas/Id" } } } }
      responses:
        "204": { description: Ordered }
        "404": { $ref: "#/components/responses/Error" }
  /v1/todos/completed:
    get:
      summary: All my completed to-dos, across my lists, newest first (kept 30 days)
      responses:
        "200":
          description: Completed to-dos
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Todo" } }
  /v1/todos/lists/{listId}/completed:
    get:
      summary: A list's completed to-dos, newest first (kept 30 days)
      parameters:
        - { name: listId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: Completed to-dos
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Todo" } }
        "404": { $ref: "#/components/responses/Error" }
  # ---------------- rolodex: a personal CRM (contacts in code) ----------------
  /v1/contacts:
    get:
      summary: Everyone, sorted by name - my entries, then the connections I haven't written about (contactId null)
      responses:
        "200":
          description: My people
          content:
            application/json:
              schema:
                type: object
                required: [people]
                properties:
                  people: { type: array, items: { $ref: "#/components/schemas/Contact" } }
    post:
      summary: >-
        Add someone, by name; with userId, an entry about that connection. Errors invalid_name (400), not my connection
        (404), already_linked (409), too_many_contacts (409, 5,000)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
                userId: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Id" }] }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/Contact" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/contacts/{contactId}:
    get:
      summary: One of my entries
      parameters:
        - { name: contactId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { description: The entry, content: { application/json: { schema: { $ref: "#/components/schemas/Contact" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: >-
        Save the whole entry - name, rhythm (null for none) and dates (replacing its dates). Starting a rhythm sets
        keepSince; changing it keeps it. Errors invalid_name, invalid_rhythm, invalid_date (400)
      parameters:
        - { name: contactId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
                keepInTouchDays: { type: [integer, "null"], enum: [7, 14, 30, 90, 180, 365, null] }
                dates: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/ContactDate" } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Contact" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete an entry and its notes (a connection is still listed, as one I haven't written about)
      parameters:
        - { name: contactId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /v1/contacts/{contactId}/link:
    put:
      summary: Link an entry to a connection. Errors not my connection (404), already_linked (409)
      parameters:
        - { name: contactId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [userId], properties: { userId: { $ref: "#/components/schemas/Id" } } }
      responses:
        "200": { description: Linked, content: { application/json: { schema: { $ref: "#/components/schemas/Contact" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Unlink an entry (it stays; the connection is listed by themselves again)
      parameters:
        - { name: contactId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "204": { description: Unlinked }
        "404": { $ref: "#/components/responses/Error" }
  /v1/contacts/{contactId}/notes:
    get:
      summary: An entry's notes and catch-ups, oldest first
      parameters:
        - { name: contactId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: Its log
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ContactNote" } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: >-
        Add a note, or a catch-up (caughtUp; words optional; at dates it earlier, never later than tomorrow). Errors
        invalid_note, invalid_date (400), too_many_notes (409, 500)
      parameters:
        - { name: contactId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 10000 }
                caughtUp: { type: boolean }
                at: { type: string, format: date, description: "A catch-up's day, when it wasn't today" }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/ContactNote" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/contacts/{contactId}/notes/{noteId}:
    delete:
      summary: Delete a note or catch-up
      parameters:
        - { name: contactId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { name: noteId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Before: { name: before, in: query, schema: { type: string, format: date-time } }
    Limit: { name: limit, in: query, schema: { type: integer } }
    PostId: { name: postId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    ChatId: { name: chatId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
  requestBodies:
    TodoBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title]
            properties:
              title: { type: string, maxLength: 500 }
              listId: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Id" }], description: "Left out or null: General (or, when editing, where it is)" }
    ListName:
      required: true
      content:
        application/json:
          schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 100 } } }
    SourceUrl:
      required: true
      content:
        application/json:
          schema: { type: object, required: [url], properties: { url: { type: string, maxLength: 2048, description: "A site or feed address; https:// is added if missing" } } }
    Email:
      required: true
      content:
        application/json:
          schema: { type: object, required: [email], properties: { email: { type: string } } }
    CircleName:
      required: true
      content:
        application/json:
          schema: { type: object, required: [name], properties: { name: { type: string, description: "1-40 characters" } } }
  responses:
    Error:
      description: A fixed error code, plus fixed details for some codes
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
              attemptsLeft: { type: integer }
              lockSeconds: { type: integer }
              retryAfter: { type: integer }
              email: { type: string }
    Status:
      description: OK
      content:
        application/json:
          schema: { type: object, properties: { status: { type: string } } }
    Tokens:
      description: A signed-in session for one device
      content:
        application/json:
          schema:
            type: object
            required: [userId, deviceId, accessToken, refreshToken, expiresIn]
            properties:
              userId: { $ref: "#/components/schemas/Id" }
              deviceId: { $ref: "#/components/schemas/Id" }
              accessToken: { type: string }
              refreshToken: { type: string }
              expiresIn: { type: integer }
    Me:
      description: My account
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Me" }
    Posts:
      description: Posts, newest first
      content:
        application/json:
          schema: { type: array, items: { $ref: "#/components/schemas/Post" } }
  schemas:
    Id: { type: string, format: uuid }
    TodoList:
      type: object
      required: [listId, name, general]
      properties:
        listId: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        general: { type: boolean, description: General is where quick add puts things; it can be renamed but not deleted }
    Todo:
      type: object
      required: [todoId, listId, title, noteCount, completedAt, createdAt]
      properties:
        todoId: { $ref: "#/components/schemas/Id" }
        listId: { $ref: "#/components/schemas/Id" }
        title: { type: string }
        noteCount: { type: integer, description: How many notes it has (the list shows a mark when there are any) }
        completedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    TodoNote:
      type: object
      required: [noteId, body, createdAt]
      properties:
        noteId: { $ref: "#/components/schemas/Id" }
        body: { type: string }
        createdAt: { type: string, format: date-time, description: When it was added }
    Contact:
      description: >-
        One person in my Rolodex (personal CRM), seen only by me. contactId is null for a connection I haven't written about;
        person is there only while they're my connection
      type: object
      required: [contactId, name, person, dates, keepInTouchDays, keepSince, lastCaughtUp, noteCount]
      properties:
        contactId: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Id" }] }
        name: { type: string }
        person: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Person" }] }
        dates: { type: array, items: { $ref: "#/components/schemas/ContactDate" } }
        keepInTouchDays: { type: [integer, "null"], description: "Catch up every this many days (7, 14, 30, 90, 180, 365)" }
        keepSince: { type: [string, "null"], format: date-time, description: When the rhythm started }
        lastCaughtUp: { type: [string, "null"], format: date-time, description: The latest catch-up in the log }
        noteCount: { type: integer }
    ContactDate:
      type: object
      required: [label, month, day]
      properties:
        label: { type: string, maxLength: 40, description: "Birthday, Anniversary, or my own words" }
        month: { type: integer, minimum: 1, maximum: 12 }
        day: { type: integer, minimum: 1, maximum: 31 }
        year: { type: [integer, "null"], description: When it's known (so the app can show an age) }
    ContactNote:
      type: object
      required: [noteId, body, caughtUp, at]
      properties:
        noteId: { $ref: "#/components/schemas/Id" }
        body: { type: string, description: Empty for a catch-up without words }
        caughtUp: { type: boolean }
        at: { type: string, format: date-time, description: When it happened }
    FoundSource:
      type: object
      required: [feedUrl, title, siteUrl, following, articles, icon]
      properties:
        feedUrl: { type: string }
        title: { type: string }
        siteUrl: { type: [string, "null"] }
        following: { type: boolean, description: Whether I follow it already }
        articles:
          type: array
          items:
            type: object
            required: [title, publishedAt]
            properties: { title: { type: string }, publishedAt: { type: string, format: date-time } }
        icon: { type: [string, "null"], description: "Signed Circlo link to the source's logo (GET /v1/reading/image), relative to the API; null: draw its initial" }
    ReadingSource:
      type: object
      required: [sourceId, title, feedUrl, siteUrl, updatedAt, failingSince, unread, icon]
      properties:
        sourceId: { $ref: "#/components/schemas/Id" }
        title: { type: string }
        feedUrl: { type: string }
        siteUrl: { type: [string, "null"] }
        updatedAt: { type: [string, "null"], format: date-time, description: Last time Circlo read it }
        failingSince: { type: [string, "null"], format: date-time, description: Set while it can't be read }
        unread: { type: integer }
        icon: { type: [string, "null"], description: "Signed Circlo link to the source's logo (GET /v1/reading/image), relative to the API; null: draw its initial" }
    ReadingArticle:
      type: object
      required: [articleId, sourceId, sourceTitle, title, summary, url, author, publishedAt, read, hasContent, sourceIcon, audio, image]
      properties:
        articleId: { $ref: "#/components/schemas/Id" }
        sourceId: { $ref: "#/components/schemas/Id" }
        sourceTitle: { type: string }
        title: { type: string }
        summary: { type: string, description: Plain text, up to about 300 characters }
        url: { type: string, description: The article on its own site, without tracking parameters }
        author: { type: [string, "null"] }
        publishedAt: { type: string, format: date-time }
        read: { type: boolean }
        hasContent: { type: boolean, description: "There's more to read in Circlo (GET /v1/reading/articles/{id}); otherwise it opens on its site" }
        sourceIcon: { type: [string, "null"], description: "Signed Circlo link to the source's logo (GET /v1/reading/image), relative to the API; null: draw its initial" }
        audio:
          description: A podcast episode's audio, played from the podcast's own server (its download counts stay right); null for articles
          oneOf:
            - type: "null"
            - type: object
              required: [url, type, durationSeconds]
              properties:
                url: { type: string }
                type: { type: [string, "null"], description: e.g. audio/mpeg }
                durationSeconds: { type: [integer, "null"] }
        image: { type: [string, "null"], description: "The item's own picture (an episode's artwork, a video's thumbnail): a signed Circlo link (GET /v1/reading/image), relative to the API" }
    ContentRun:
      type: object
      required: [text]
      properties:
        text: { type: string }
        b: { type: boolean, description: Bold }
        i: { type: boolean, description: Italic }
        code: { type: boolean }
        href: { type: string, description: An http(s) link, without tracking parameters }
    ContentBlock:
      type: object
      description: >-
        One block of an article: p, h (heading) and quote have runs; list has ordered and items (each a list of runs);
        code has text; img has src (a signed Circlo path), alt, and w and h when known; hr has nothing else
      required: [type]
      properties:
        type: { type: string, enum: [p, h, quote, list, code, img, hr] }
        runs: { type: array, items: { $ref: "#/components/schemas/ContentRun" } }
        ordered: { type: boolean }
        items: { type: array, items: { type: array, items: { $ref: "#/components/schemas/ContentRun" } } }
        text: { type: string }
        src: { type: string }
        alt: { type: string }
        w: { type: integer }
        h: { type: integer }
    ObjectKey: { type: string, pattern: "^[0-9a-f]{64}$" }
    Me:
      type: object
      required: [userId, name, username, email, bio, createdAt, emailNotifications, pushMessages, pushReplies, pushFriends, pushDaily, showInCircles, admin]
      properties:
        userId: { $ref: "#/components/schemas/Id" }
        name: { type: [string, "null"], description: "Null until I set one" }
        username: { type: string }
        email: { type: string }
        bio: { type: string }
        avatarUrl: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        emailNotifications: { type: boolean, description: "The daily email, around 6pm on days with something new" }
        pushMessages: { type: boolean, description: "Messages pushed to my phones as they come" }
        pushReplies: { type: boolean, description: "Replies pushed to my phones as they come" }
        pushFriends: { type: boolean, description: "Friend requests and new friends pushed to my phones as they come" }
        pushDaily: { type: boolean, description: "The 6pm reminder pushed to my phones (new posts from my circles and anything else new)" }
        showInCircles: { type: boolean, description: "People in the same circles as me see me on that friend's profile" }
        admin: { type: boolean, description: "I can see the growth totals (my email is in CIRCLO_ADMIN_EMAILS)" }
    InviteLink:
      type: object
      required: [token, link]
      properties:
        token: { type: string }
        link: { type: string }
    Person:
      description: Someone as shown next to their posts, replies and messages (never their email)
      type: object
      required: [userId, name, username]
      properties:
        userId: { $ref: "#/components/schemas/Id" }
        name: { type: string, description: "Their name, or their username while they haven't set one" }
        username: { type: string }
        avatarUrl: { type: [string, "null"] }
    Circle:
      type: object
      required: [id, name, membersVisible, members]
      properties:
        id: { type: integer, minimum: 1, maximum: 8 }
        name: { type: string }
        membersVisible: { type: boolean, description: "Its people see each other on my profile (never its name)" }
        members: { type: array, items: { $ref: "#/components/schemas/Id" } }
    CircleMate:
      description: Someone in the same circle of a friend as me, with how we're connected (null if we aren't)
      type: object
      required: [userId, name, username, relation]
      properties:
        userId: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        username: { type: string }
        avatarUrl: { type: [string, "null"] }
        relation: { type: [string, "null"], enum: [accepted, incoming, outgoing, null] }
    Audience:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [onlyMe, everyone, circles] }
        circles: { type: array, items: { type: integer } }
    NewAttachment:
      description: A photo (with its thumbnail) or a video (with its poster frame), both uploaded first
      type: object
      required: [type, objectKey, previewKey, width, height, durationMs]
      properties:
        type: { type: string, enum: [image, video] }
        objectKey: { $ref: "#/components/schemas/ObjectKey" }
        previewKey: { $ref: "#/components/schemas/ObjectKey" }
        width: { type: integer }
        height: { type: integer }
        durationMs: { type: integer }
    Attachment:
      type: object
      required: [type, mime, width, height, durationMs, objectKey, url, previewKey, previewUrl]
      properties:
        type: { type: string, enum: [image, video] }
        mime: { type: string }
        width: { type: integer }
        height: { type: integer }
        durationMs: { type: integer }
        objectKey: { $ref: "#/components/schemas/ObjectKey" }
        url: { type: string, description: "Presigned GET URL (1 hour)" }
        previewKey: { $ref: "#/components/schemas/ObjectKey" }
        previewUrl: { type: string }
    Post:
      type: object
      required: [postId, authorId, author, text, createdAt, media, replyCount, likeCount, likedByMe]
      properties:
        postId: { $ref: "#/components/schemas/Id" }
        authorId: { $ref: "#/components/schemas/Id" }
        author: { $ref: "#/components/schemas/Person" }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        media: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
        replyCount: { type: integer }
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        audience:
          description: Only on my own posts
          oneOf:
            - { $ref: "#/components/schemas/Audience" }
            - { type: "null" }
    Reply:
      type: object
      required: [replyId, authorId, author, text, createdAt, likeCount, likedByMe]
      properties:
        replyId: { $ref: "#/components/schemas/Id" }
        authorId: { $ref: "#/components/schemas/Id" }
        author: { $ref: "#/components/schemas/Person" }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        parentId:
          type: [string, "null"]
          format: uuid
          description: The reply this answers; null for a reply to the post, or when I can't see that reply
        replyingTo:
          description: Who wrote the reply this answers (null in the same cases as parentId)
          oneOf: [{ $ref: "#/components/schemas/Person" }, { type: "null" }]
    Message:
      type: object
      required: [seq, messageId, senderId, text, media, createdAt]
      properties:
        seq: { type: integer, format: int64 }
        messageId: { $ref: "#/components/schemas/Id" }
        senderId: { $ref: "#/components/schemas/Id" }
        text: { type: string }
        media: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
        replyTo:
          description: The message this one replies to, if it's a reply
          oneOf:
            - { $ref: "#/components/schemas/Quote" }
            - { type: "null" }
        createdAt: { type: string, format: date-time }
    Quote:
      type: object
      description: >-
        The message a reply answers: its sender and its first 140 characters (with "…" when there's more), or the type
        of its first photo or video when it has no text. Once it's deleted, or its sender is someone I blocked,
        `available` is false and only `messageId` is given.
      required: [messageId, available]
      properties:
        messageId: { $ref: "#/components/schemas/Id" }
        available: { type: boolean }
        senderId:
          oneOf:
            - { $ref: "#/components/schemas/Id" }
            - { type: "null" }
        text: { type: [string, "null"] }
        mediaType: { type: [string, "null"], enum: [image, video, null] }
    Chat:
      type: object
      required: [chatId, members, unread, readSeq, updatedAt]
      properties:
        chatId: { $ref: "#/components/schemas/Id" }
        name: { type: [string, "null"] }
        members: { type: array, items: { $ref: "#/components/schemas/Person" } }
        lastMessage:
          oneOf:
            - { $ref: "#/components/schemas/Message" }
            - { type: "null" }
        unread: { type: integer }
        readSeq: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
