openapi: 3.1.0
info:
  title: Circlo API
  version: 1.0.0
  description: >
    circlo-server API, used by the iOS and Android apps and the web app (app.hellocirclo.com). Requests go over HTTPS;
    content is stored as sent and the server decides who may see it. IDs are UUID strings; times are ISO-8601 instants.
    Errors are `{"error": "<code>"}` (plus fixed details such as `attemptsLeft`) and never echo request data.
    Photos and videos go straight between the app and storage through short-lived presigned URLs.
servers:
  - url: http://localhost:8080
security:
  - bearer: []

paths:
  # ---------------- auth ----------------
  /v1/auth/signup:
    post:
      summary: Start a signup; emails a 6-digit code to verify the address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string, description: "3-30 of [a-z0-9_], case-insensitive" }
                email: { type: string }
                password: { type: string, description: "12-128 characters" }
      responses:
        "201":
          description: Code sent
          content:
            application/json:
              schema: { type: object, required: [email], properties: { email: { type: string } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/signup/resend:
    post:
      summary: Send a new code for an unfinished signup (says nothing about whether one exists)
      security: []
      requestBody: { $ref: "#/components/requestBodies/Email" }
      responses:
        "202": { $ref: "#/components/responses/Status" }
  /v1/auth/signup/verify:
    post:
      summary: Finish a signup with the emailed code; signs this device in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties: { email: { type: string }, code: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/auth/login:
    post:
      summary: Log in with a username or email and password
      description: >
        401 carries `attemptsLeft` (and `lockSeconds` when this failure set a lock); 429 `locked` carries `retryAfter`.
        An account whose email isn't verified yet answers 403 `email_not_verified` with `email`, and gets a fresh code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string }
                password: { type: string }
                emailCode:
                  type: boolean
                  description: >-
                    true from apps that do the emailed-code step (1.1.0 on): the right password emails a 6-digit code
                    and answers 202. Apps already in the stores omit it and are signed in at once (200), unless the
                    server sets CIRCLO_LOGIN_CODE_FOR_OLD_APPS.
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "202":
          description: The right password; a sign-in code was emailed (nothing is signed in yet)
          content:
            application/json:
              schema:
                type: object
                required: [status, email, challenge]
                properties:
                  status: { type: string, enum: [code_sent] }
                  email: { type: string, description: "Where it went, partly hidden: z•••@hey.com" }
                  challenge: { type: string, description: "This attempt's one-time challenge, for /login/verify and /login/resend" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/login/verify:
    post:
      summary: Finish signing in with the emailed code and the attempt's challenge; signs this device in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, challenge, code]
              properties: { login: { type: string }, challenge: { type: string }, code: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/auth/login/resend:
    post:
      summary: A new sign-in code for the same attempt (says nothing about whether one was sent)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, challenge]
              properties: { login: { type: string }, challenge: { type: string } }
      responses:
        "202": { $ref: "#/components/responses/Status" }
  /v1/auth/refresh:
    post:
      summary: Rotate the refresh token (single use; reusing an old one signs out every device)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/auth/password/forgot:
    post:
      summary: Email a password-reset code (says nothing about whether the account exists)
      security: []
      requestBody: { $ref: "#/components/requestBodies/Email" }
      responses:
        "202": { $ref: "#/components/responses/Status" }
  /v1/auth/password/reset:
    post:
      summary: Set a new password with the emailed code; signs out every device and signs this one in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password]
              properties: { email: { type: string }, code: { type: string }, password: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/auth/password/change:
    post:
      summary: Change the password (signed in); other devices are signed out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties: { currentPassword: { type: string }, newPassword: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/logout:
    post:
      summary: Sign this device out
      responses:
        "200": { $ref: "#/components/responses/Status" }

  # ---------------- my account ----------------
  /v1/me:
    get:
      summary: My account
      responses:
        "200": { $ref: "#/components/responses/Me" }
  /v1/me/profile:
    put:
      summary: Change my name and bio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, bio]
              properties: { name: { type: string, description: "1-50 characters; empty clears it" }, bio: { type: string, description: "Up to 160 characters" } }
      responses:
        "200": { $ref: "#/components/responses/Me" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/me/notifications:
    put:
      summary: >-
        The daily email about activity on or off (only sent while I'm not signed in to the phone app), and the hour
        (UTC) the daily note comes at; either may be left out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: boolean }
                digestHour: { type: integer, minimum: 0, maximum: 23 }
      responses:
        "200": { $ref: "#/components/responses/Me" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/email/unsubscribe:
    parameters:
      - { name: u, in: query, required: true, schema: { $ref: "#/components/schemas/Id" } }
      - { name: t, in: query, required: true, schema: { type: string } }
    get:
      summary: The unsubscribe link in notification emails (public, signed). Shows a page with one button
      security: []
      responses:
        "200": { description: An HTML page, content: { text/html: { schema: { type: string } } } }
        "404": { description: Not a genuine link, content: { text/html: { schema: { type: string } } } }
    post:
      summary: Turn notification emails off (the page's button, or a mail app's one-click unsubscribe, RFC 8058)
      security: []
      responses:
        "200": { description: An HTML page, content: { text/html: { schema: { type: string } } } }
        "404": { description: Not a genuine link, content: { text/html: { schema: { type: string } } } }
  /v1/me/avatar:
    put:
      summary: Set my photo to an image I just uploaded
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [objectKey], properties: { objectKey: { $ref: "#/components/schemas/ObjectKey" } } }
      responses:
        "200": { $ref: "#/components/responses/Me" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove my photo
      responses:
        "200": { $ref: "#/components/responses/Me" }
  /v1/me/export:
    get:
      summary: A copy of my data (profile, circles, friends, posts, replies, chats) as JSON
      responses:
        "200":
          description: My data
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /v1/me/storage:
    get:
      summary: >-
        How much storage my account uses: the photos and videos on my posts and chat messages (with their thumbnails
        and poster frames, counted as photos), my profile photo and my Desk files
      responses:
        "200":
          description: Storage used, in bytes, and how many photos and videos
          content:
            application/json:
              schema:
                type: object
                required: [usedBytes, photoBytes, videoBytes, profilePhotoBytes, photos, videos, deskBytes, deskFiles]
                properties:
                  usedBytes: { type: integer, format: int64 }
                  photoBytes: { type: integer, format: int64 }
                  videoBytes: { type: integer, format: int64 }
                  profilePhotoBytes: { type: integer, format: int64 }
                  photos: { type: integer, format: int64 }
                  videos: { type: integer, format: int64 }
                  deskBytes: { type: integer, format: int64, description: "My Desk files, whatever their type, with their thumbnails" }
                  deskFiles: { type: integer, format: int64 }
  /v1/me/preview/{friendId}:
    get:
      summary: My posts exactly as this friend sees them
      parameters:
        - { name: friendId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { $ref: "#/components/parameters/Before" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { $ref: "#/components/responses/Posts" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/account:
    delete:
      summary: Delete my account and everything in it (needs my password)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [password], properties: { password: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/devices:
    get:
      summary: The devices and browsers signed in to my account
      responses:
        "200":
          description: Devices, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [deviceId, createdAt, current, kind]
                  properties:
                    deviceId: { $ref: "#/components/schemas/Id" }
                    createdAt: { type: string, format: date-time }
                    current: { type: boolean }
                    kind: { type: [string, "null"], enum: [ios, android, web, null], description: "Null for a sign-in from before this was recorded" }
  /v1/devices/{deviceId}:
    delete:
      summary: Sign a device out
      parameters:
        - { name: deviceId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/devices/current:
    put:
      summary: Say which kind of app this sign-in is (only this; it decides push or email for activity)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [kind], properties: { kind: { type: string, enum: [ios, android, web] } } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/devices/current/push-token:
    put:
      summary: Register this device's push token (content-free pushes; forgotten on sign-out or revoke)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, service]
              properties:
                token: { type: string }
                service: { type: string, enum: [apns, apns_sandbox, fcm] }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      summary: Stop pushes to this device
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /v1/events:
    get:
      summary: Live updates. Answers with my version as soon as it differs from `since` (at once if it already does), else after 25 s
      parameters:
        - { name: since, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: My current version; the app refreshes what it shows when it changes
          content:
            application/json:
              schema: { type: object, required: [version], properties: { version: { type: integer, format: int64 } } }
  /v1/devices/current/check-token:
    post:
      summary: Turn on background checks for this device; returns its check token
      responses:
        "200":
          description: The check token
          content:
            application/json:
              schema: { type: object, required: [token], properties: { token: { type: string } } }
    delete:
      summary: Turn background checks off for this device
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /v1/security-events:
    get:
      summary: Recent sign-ins to my account (30 days, newest first)
      responses:
        "200":
          description: Sign-ins
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      required: [id, kind, createdAt]
                      properties:
                        id: { $ref: "#/components/schemas/Id" }
                        kind: { type: string, enum: [sign_in] }
                        createdAt: { type: string, format: date-time }

  # ---------------- people ----------------
  /v1/users/{userId}:
    get:
      summary: Someone's profile (mine, or someone I'm connected with)
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: Their profile
          content:
            application/json:
              schema:
                type: object
                required: [userId, name, username, bio, relation, friendCount]
                properties:
                  userId: { $ref: "#/components/schemas/Id" }
                  name: { type: string }
                  username: { type: string }
                  bio: { type: string }
                  avatarUrl: { type: [string, "null"] }
                  relation: { type: string, enum: [me, accepted, incoming, outgoing] }
                  friendCount: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
  /v1/users/{userId}/posts:
    get:
      summary: Someone's posts that I may see, newest first
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { $ref: "#/components/parameters/Before" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { $ref: "#/components/responses/Posts" }
  /v1/users/{userId}/replies:
    get:
      summary: Someone's replies on posts I may see, newest first, each with its post
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { $ref: "#/components/parameters/Before" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Replies with their posts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [reply, post]
                  properties:
                    reply: { $ref: "#/components/schemas/Reply" }
                    post: { $ref: "#/components/schemas/Post" }
  /v1/invites/link:
    get:
      summary: My invite link (the same until I reset it; made the first time I ask)
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteLink" }
  /v1/invites/link/reset:
    post:
      summary: A new invite link; the old one and its QR code stop working (people who joined stay connected)
      responses:
        "200":
          description: The new link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteLink" }
  /v1/invites/preview:
    post:
      summary: Who an invite is from (changes nothing)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "200":
          description: Who it's from
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/invites/join:
    post:
      summary: >-
        Use an invite, putting its owner in my circles. Someone's link connects at once (status accepted) and they're
        told; a one-time invite sends a request (status outgoing).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                circles: { type: array, items: { type: integer } }
      responses:
        "200":
          description: Connected, or the request sent
          content:
            application/json:
              schema:
                type: object
                required: [userId, status]
                properties:
                  userId: { $ref: "#/components/schemas/Id" }
                  status: { type: string, enum: [accepted, outgoing] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/invites:
    post:
      summary: A single-use invite link (7 days); for older apps
      responses:
        "201":
          description: The invite
          content:
            application/json:
              schema:
                type: object
                required: [token, link, expiresAt]
                properties:
                  token: { type: string }
                  link: { type: string }
                  expiresAt: { type: string, format: date-time }
        "409": { $ref: "#/components/responses/Error" }
  /v1/invites/redeem:
    post:
      summary: Use an invite; returns who sent it (for older apps; someone's link connects here already)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "200":
          description: Who sent it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/friends:
    get:
      summary: My friends and pending requests (with the circles I put each one in)
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [userId, status, since, name, username, circles]
                  properties:
                    userId: { $ref: "#/components/schemas/Id" }
                    status: { type: string, enum: [accepted, incoming, outgoing] }
                    since: { type: string, format: date-time }
                    name: { type: string }
                    username: { type: string }
                    bio: { type: string, description: "As on their profile; empty when they haven't written one" }
                    avatarUrl: { type: [string, "null"] }
                    circles: { type: array, items: { type: integer } }
  /v1/friends/requests:
    post:
      summary: Ask someone whose invite I redeemed to connect, putting them in my circles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toUserId]
              properties:
                toUserId: { $ref: "#/components/schemas/Id" }
                circles: { type: array, items: { type: integer } }
      responses:
        "201": { $ref: "#/components/responses/Status" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/friends/{userId}:
    delete:
      summary: Unfriend (or cancel my request)
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/friends/{userId}/accept:
    post:
      summary: Accept a request, putting them in my circles
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { circles: { type: array, items: { type: integer } } } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/friends/{userId}/decline:
    post:
      summary: Decline a request
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/friends/{userId}/circles:
    put:
      summary: Set which of my circles they're in (silent)
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [circles], properties: { circles: { type: array, items: { type: integer } } } }
      responses:
        "200":
          description: The circles they're in now
          content:
            application/json:
              schema: { type: object, required: [circles], properties: { circles: { type: array, items: { type: integer } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/circles:
    get:
      summary: My circles with their members (only ever shown to me)
      responses:
        "200":
          description: My circles
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Circle" } }
    post:
      summary: Add a circle (up to 8)
      requestBody: { $ref: "#/components/requestBodies/CircleName" }
      responses:
        "201":
          description: The new circle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Circle" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/circles/{id}:
    put:
      summary: Rename a circle
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody: { $ref: "#/components/requestBodies/CircleName" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a circle (posts already shared with it keep their audience)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/blocks:
    get:
      summary: People I blocked
      responses:
        "200":
          description: Blocked people, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [userId, name, username, createdAt]
                  properties:
                    userId: { $ref: "#/components/schemas/Id" }
                    name: { type: string }
                    username: { type: string }
                    createdAt: { type: string, format: date-time }
  /v1/blocks/{userId}:
    post:
      summary: Block someone (ends any connection)
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Unblock
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /v1/reports:
    post:
      summary: Report a post, person or chat message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, targetId, reason]
              properties:
                kind: { type: string, enum: [post, user, message, reply] }
                targetId: { $ref: "#/components/schemas/Id" }
                reason: { type: string }
                note: { type: string }
      responses:
        "201": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }

  # ---------------- media ----------------
  /v1/media/uploads:
    post:
      summary: Upload slots (presigned PUT URLs locked to each size and type, 15 minutes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: object
                    required: [size, mime]
                    properties:
                      size: { type: integer, format: int64 }
                      mime: { type: string, enum: [image/jpeg, image/png, image/webp, video/mp4, video/quicktime, video/webm] }
      responses:
        "200":
          description: One slot per file, in order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [objectKey, putUrl, size, mime]
                  properties:
                    objectKey: { $ref: "#/components/schemas/ObjectKey" }
                    putUrl: { type: string }
                    size: { type: integer, format: int64 }
                    mime: { type: string }
        "400": { $ref: "#/components/responses/Error" }

  # ---------------- posts ----------------
  /v1/feed:
    get:
      summary: My posts and my friends' posts that I may see, newest first
      parameters:
        - { $ref: "#/components/parameters/Before" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { $ref: "#/components/responses/Posts" }
  /v1/posts:
    post:
      summary: Create a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, audience]
              properties:
                text: { type: string, description: "Up to 1,500 characters; may be empty with media" }
                audience: { $ref: "#/components/schemas/Audience" }
                media: { type: array, items: { $ref: "#/components/schemas/NewAttachment" } }
      responses:
        "201":
          description: The new post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}:
    get:
      summary: One post I may see
      parameters:
        - { $ref: "#/components/parameters/PostId" }
      responses:
        "200":
          description: The post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete my post
      parameters:
        - { $ref: "#/components/parameters/PostId" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}/audience:
    put:
      summary: Change who can see my post (at once; nobody is told). 404 for anyone but the author
      parameters:
        - { $ref: "#/components/parameters/PostId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Audience" }
      responses:
        "200":
          description: The post, with its new audience
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}/replies:
    get:
      summary: Replies, oldest first
      parameters:
        - { $ref: "#/components/parameters/PostId" }
        - { name: after, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Replies
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Reply" } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Reply, to the post or (with parentId) to one of its replies I can see; an answer stays in that reply's circle
      parameters:
        - { $ref: "#/components/parameters/PostId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                parentId: { $ref: "#/components/schemas/Id" }
      responses:
        "201":
          description: The new reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reply" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}/replies/{replyId}:
    delete:
      summary: Delete a reply (mine, or any on my post)
      parameters:
        - { $ref: "#/components/parameters/PostId" }
        - { name: replyId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}/replies/{replyId}/like:
    put:
      summary: Like a reply
      parameters:
        - { $ref: "#/components/parameters/PostId" }
        - { name: replyId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Unlike a reply
      parameters:
        - { $ref: "#/components/parameters/PostId" }
        - { name: replyId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}/like:
    put:
      summary: Like
      parameters:
        - { $ref: "#/components/parameters/PostId" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Unlike
      parameters:
        - { $ref: "#/components/parameters/PostId" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}/likes:
    get:
      summary: Who liked a post
      parameters:
        - { $ref: "#/components/parameters/PostId" }
      responses:
        "200":
          description: Likers, oldest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Person" } }
        "404": { $ref: "#/components/responses/Error" }

  # ---------------- activity ----------------
  /v1/activity:
    get:
      summary: Replies and likes on my posts, likes on my replies, and people who joined with my link, newest first
      parameters:
        - { $ref: "#/components/parameters/Before" }
        - { $ref: "#/components/parameters/Limit" }
        - name: replies
          in: query
          description: "all: also the newer kinds, answers to my replies on other people's posts (reply_reply) and my requests that were accepted (accepted)"
          schema: { type: string, enum: [all] }
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [kind, postId, postText, actorId, actor, createdAt]
                      properties:
                        kind: { type: string, enum: [reply, like, reply_like, reply_reply, joined, accepted] }
                        postId: { type: [string, "null"], format: uuid }
                        postText: { type: [string, "null"] }
                        actorId: { $ref: "#/components/schemas/Id" }
                        actor: { $ref: "#/components/schemas/Person" }
                        replyId: { type: [string, "null"], format: uuid }
                        replyText: { type: [string, "null"] }
                        createdAt: { type: string, format: date-time }
  /v1/activity/pending:
    get:
      summary: Counts of new activity since a time (background checks; authenticated by the check token)
      security: []
      parameters:
        - { name: since, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: X-Circlo-Check-Token, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                type: object
                required: [requests, replies, likes, messages, signIns]
                properties:
                  requests: { type: integer }
                  replies: { type: integer }
                  likes: { type: integer }
                  messages: { type: integer }
                  signIns: { type: integer }
        "401": { $ref: "#/components/responses/Error" }

  # ---------------- chats ----------------
  /v1/chats:
    get:
      summary: My chats, most recent first
      responses:
        "200":
          description: Chats
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Chat" } }
    post:
      summary: Start a chat with friends (a 1:1 chat that exists already is reused)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds: { type: array, items: { $ref: "#/components/schemas/Id" } }
                name: { type: string }
      responses:
        "201":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/chats/{chatId}:
    get:
      summary: One chat
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      responses:
        "200":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/chats/{chatId}/members:
    post:
      summary: Add friends to a chat
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties: { userIds: { type: array, items: { $ref: "#/components/schemas/Id" } } }
      responses:
        "200":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/chats/{chatId}/members/{userId}:
    delete:
      summary: Remove someone from a chat, or leave it (my own id)
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
        - { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/chats/{chatId}/messages:
    get:
      summary: Messages after `after`, or the latest page before `before` (both oldest first)
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
        - { name: after, in: query, schema: { type: integer, format: int64 } }
        - { name: before, in: query, schema: { type: integer, format: int64 } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Message" } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Send a message
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                media: { type: array, items: { $ref: "#/components/schemas/NewAttachment" } }
      responses:
        "201":
          description: The message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/chats/{chatId}/messages/{messageId}:
    delete:
      summary: Delete one of my messages for everyone
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
        - { name: messageId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/chats/{chatId}/read:
    post:
      summary: Mark messages up to `seq` as read
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [seq], properties: { seq: { type: integer, format: int64 } } }
      responses:
        "200": { $ref: "#/components/responses/Status" }

  # ---------------- desk (owner decision 2026-11-14, boards 2026-11-15) ----------------
  # A personal space of boards, each with its own to-dos, notes and files, all of which take comments. Everything in
  # it belongs to one person and is never shared: anything that isn't mine is 404, exactly as if it didn't exist.
  /v1/desk/boards:
    get:
      summary: My boards by name, with how many open to-dos, notes and files each has
      responses:
        "200":
          description: Boards
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DeskBoard" } }
    post:
      summary: Start a board (up to 200)
      requestBody: { $ref: "#/components/requestBodies/DeskName" }
      responses:
        "201":
          description: The new board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskBoard" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/desk/boards/{id}:
    parameters:
      - { $ref: "#/components/parameters/DeskId" }
    get:
      summary: One of my boards
      responses:
        "200":
          description: The board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskBoard" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Rename a board
      requestBody: { $ref: "#/components/requestBodies/DeskName" }
      responses:
        "200":
          description: The board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskBoard" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a board and everything on it (its files' storage is freed)
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/desk/boards/{id}/todos:
    parameters:
      - { $ref: "#/components/parameters/DeskId" }
    get:
      summary: A board's open to-dos (oldest first) and the 30 most recently done
      responses:
        "200":
          description: To-dos
          content:
            application/json:
              schema:
                type: object
                required: [open, done]
                properties:
                  open: { type: array, items: { $ref: "#/components/schemas/DeskTodo" } }
                  done: { type: array, items: { $ref: "#/components/schemas/DeskTodo" } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/desk/boards/{id}/notes:
    parameters:
      - { $ref: "#/components/parameters/DeskId" }
    get:
      summary: A board's notes, pinned first, then the most recently changed or commented on (up to 1000)
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DeskNoteSummary" } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/desk/boards/{id}/files:
    parameters:
      - { $ref: "#/components/parameters/DeskId" }
    get:
      summary: A board's files, newest first, with download URLs (up to 2000)
      responses:
        "200":
          description: Files
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DeskFile" } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/desk/today:
    get:
      summary: Open to-dos due on or before `date` (my today) on all my boards, earliest first
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: To-dos
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DeskTodo" } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/desk/todos:
    post:
      summary: Add a to-do to one of my boards
      requestBody: { $ref: "#/components/requestBodies/DeskTodoInput" }
      responses:
        "201":
          description: The new to-do
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskTodo" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/desk/todos/{id}:
    parameters:
      - { $ref: "#/components/parameters/DeskId" }
    get:
      summary: A to-do with its comments, and the earlier ones of its repeating series that were done (newest first, up to 20)
      responses:
        "200":
          description: The to-do
          content:
            application/json:
              schema:
                type: object
                required: [todo, history, comments]
                properties:
                  todo: { $ref: "#/components/schemas/DeskTodo" }
                  history: { type: array, items: { $ref: "#/components/schemas/DeskTodo" } }
                  comments: { type: array, items: { $ref: "#/components/schemas/DeskComment" } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Replace a to-do's board, title, description, due date and repeat (a new due date or repeat restarts its schedule)
      requestBody: { $ref: "#/components/requestBodies/DeskTodoInput" }
      responses:
        "200":
          description: The to-do
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskTodo" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a to-do and its comments
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/desk/todos/{id}/done:
    parameters:
      - { $ref: "#/components/parameters/DeskId" }
    post:
      summary: >-
        Tick a to-do off. A repeating one makes the next straight away; `today` is my calendar day (within 2 days of
        the server's), which "after N days" repeats count from. Already done: nothing changes and `next` is null.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [today], properties: { today: { type: string, format: date } } }
      responses:
        "200":
          description: The to-do, and the next one if it repeats
          content:
            application/json:
              schema:
                type: object
                required: [todo]
                properties:
                  todo: { $ref: "#/components/schemas/DeskTodo" }
                  next: { oneOf: [{ $ref: "#/components/schemas/DeskTodo" }, { type: "null" }] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Un-tick a to-do; the next one its repeat made goes again unless that has been done too
      responses:
        "200":
          description: The to-do
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskTodo" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/desk/todos/{id}/comments:
    parameters:
      - { $ref: "#/components/parameters/DeskId" }
    post:
      summary: Comment on a to-do
      requestBody: { $ref: "#/components/requestBodies/DeskCommentInput" }
      responses:
        "201": { $ref: "#/components/responses/DeskComment" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/desk/notes:
    post:
      summary: Write a note on one of my boards
      requestBody: { $ref: "#/components/requestBodies/DeskNoteInput" }
      responses:
        "201":
          description: The note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskNote" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/desk/notes/{id}:
    parameters:
      - { $ref: "#/components/parameters/DeskId" }
    get:
      summary: A note with its comments, oldest first
      responses:
        "200":
          description: The note
          content:
            application/json:
              schema:
                type: object
                required: [note, comments]
                properties:
                  note: { $ref: "#/components/schemas/DeskNote" }
                  comments: { type: array, items: { $ref: "#/components/schemas/DeskComment" } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Replace a note's board, title and description; `pinned` left out keeps it
      requestBody: { $ref: "#/components/requestBodies/DeskNoteInput" }
      responses:
        "200":
          description: The note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskNote" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a note and its comments
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/desk/notes/{id}/comments:
    parameters:
      - { $ref: "#/components/parameters/DeskId" }
    post:
      summary: Comment on a note; the note moves up its board
      requestBody: { $ref: "#/components/requestBodies/DeskCommentInput" }
      responses:
        "201": { $ref: "#/components/responses/DeskComment" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/desk/uploads:
    post:
      summary: >-
        Upload slots for a Desk file and, for a photo or video, its thumbnail or poster frame (presigned PUTs locked to
        size and type, 15 minutes). Photos up to 25 MB, videos 512 MB, anything else 100 MB. No HTML, SVG or scripts;
        other files can be kept as application/octet-stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items:
                    type: object
                    required: [size, mime]
                    properties:
                      size: { type: integer, format: int64 }
                      mime: { type: string }
      responses:
        "200":
          description: One slot per file, in order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [objectKey, putUrl, size, mime]
                  properties:
                    objectKey: { $ref: "#/components/schemas/ObjectKey" }
                    putUrl: { type: string }
                    size: { type: integer, format: int64 }
                    mime: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /v1/desk/files:
    post:
      summary: Keep an uploaded file (and its thumbnail or poster frame) on one of my boards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [boardId, title, fileName, objectKey]
              properties:
                boardId: { $ref: "#/components/schemas/Id" }
                title: { type: string, description: "1-200 characters, one line" }
                description: { type: string, description: "Up to 10000 characters" }
                fileName: { type: string, description: "The file's own name, 1-200 characters, one line" }
                objectKey: { $ref: "#/components/schemas/ObjectKey" }
                previewKey: { $ref: "#/components/schemas/ObjectKey" }
                width: { type: integer }
                height: { type: integer }
                durationMs: { type: integer }
      responses:
        "201":
          description: The file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskFile" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/desk/files/{id}:
    parameters:
      - { $ref: "#/components/parameters/DeskId" }
    get:
      summary: One of my files, with fresh download URLs, and its comments
      responses:
        "200":
          description: The file
          content:
            application/json:
              schema:
                type: object
                required: [file, comments]
                properties:
                  file: { $ref: "#/components/schemas/DeskFile" }
                  comments: { type: array, items: { $ref: "#/components/schemas/DeskComment" } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Change a file's title and description and put it on `boardId`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [boardId, title]
              properties:
                boardId: { $ref: "#/components/schemas/Id" }
                title: { type: string, description: "1-200 characters, one line" }
                description: { type: string, description: "Up to 10000 characters" }
      responses:
        "200":
          description: The file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskFile" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a file and its comments (its storage is freed)
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/desk/files/{id}/comments:
    parameters:
      - { $ref: "#/components/parameters/DeskId" }
    post:
      summary: Comment on a file
      requestBody: { $ref: "#/components/requestBodies/DeskCommentInput" }
      responses:
        "201": { $ref: "#/components/responses/DeskComment" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/desk/comments/{id}:
    parameters:
      - { $ref: "#/components/parameters/DeskId" }
    delete:
      summary: Delete one of my comments
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Before: { name: before, in: query, schema: { type: string, format: date-time } }
    Limit: { name: limit, in: query, schema: { type: integer } }
    PostId: { name: postId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    ChatId: { name: chatId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    DeskId: { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
  requestBodies:
    Email:
      required: true
      content:
        application/json:
          schema: { type: object, required: [email], properties: { email: { type: string } } }
    CircleName:
      required: true
      content:
        application/json:
          schema: { type: object, required: [name], properties: { name: { type: string, description: "1-40 characters" } } }
    DeskName:
      required: true
      content:
        application/json:
          schema: { type: object, required: [name], properties: { name: { type: string, description: "1-100 characters, one line" } } }
    DeskTodoInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [boardId, title]
            properties:
              boardId: { $ref: "#/components/schemas/Id" }
              title: { type: string, description: "1-500 characters" }
              description: { type: string, description: "Up to 10000 characters" }
              dueDate: { type: [string, "null"], format: date }
              repeat: { oneOf: [{ $ref: "#/components/schemas/DeskRepeat" }, { type: "null" }] }
    DeskNoteInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [boardId, title]
            properties:
              boardId: { $ref: "#/components/schemas/Id" }
              title: { type: string, description: "1-200 characters, one line" }
              description: { type: string, description: "Up to 50000 characters" }
              pinned: { type: boolean }
    DeskCommentInput:
      required: true
      content:
        application/json:
          schema: { type: object, required: [body], properties: { body: { type: string, description: "1-5000 characters" } } }
  responses:
    Error:
      description: A fixed error code, plus fixed details for some codes
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
              attemptsLeft: { type: integer }
              lockSeconds: { type: integer }
              retryAfter: { type: integer }
              email: { type: string }
    Status:
      description: OK
      content:
        application/json:
          schema: { type: object, properties: { status: { type: string } } }
    Tokens:
      description: A signed-in session for one device
      content:
        application/json:
          schema:
            type: object
            required: [userId, deviceId, accessToken, refreshToken, expiresIn]
            properties:
              userId: { $ref: "#/components/schemas/Id" }
              deviceId: { $ref: "#/components/schemas/Id" }
              accessToken: { type: string }
              refreshToken: { type: string }
              expiresIn: { type: integer }
    Me:
      description: My account
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Me" }
    Posts:
      description: Posts, newest first
      content:
        application/json:
          schema: { type: array, items: { $ref: "#/components/schemas/Post" } }
    DeskComment:
      description: The comment
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DeskComment" }
  schemas:
    Id: { type: string, format: uuid }
    ObjectKey: { type: string, pattern: "^[0-9a-f]{64}$" }
    Me:
      type: object
      required: [userId, name, username, email, bio, createdAt, emailNotifications]
      properties:
        userId: { $ref: "#/components/schemas/Id" }
        name: { type: [string, "null"], description: "Null until I set one" }
        username: { type: string }
        email: { type: string }
        bio: { type: string }
        avatarUrl: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        emailNotifications: { type: boolean, description: "Emails about activity while I'm not signed in to the phone app" }
    InviteLink:
      type: object
      required: [token, link]
      properties:
        token: { type: string }
        link: { type: string }
    Person:
      description: Someone as shown next to their posts, replies and messages (never their email)
      type: object
      required: [userId, name, username]
      properties:
        userId: { $ref: "#/components/schemas/Id" }
        name: { type: string, description: "Their name, or their username while they haven't set one" }
        username: { type: string }
        avatarUrl: { type: [string, "null"] }
    Circle:
      type: object
      required: [id, name, members]
      properties:
        id: { type: integer, minimum: 1, maximum: 8 }
        name: { type: string }
        members: { type: array, items: { $ref: "#/components/schemas/Id" } }
    Audience:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [onlyMe, everyone, circles] }
        circles: { type: array, items: { type: integer } }
    NewAttachment:
      description: A photo (with its thumbnail) or a video (with its poster frame), both uploaded first
      type: object
      required: [type, objectKey, previewKey, width, height, durationMs]
      properties:
        type: { type: string, enum: [image, video] }
        objectKey: { $ref: "#/components/schemas/ObjectKey" }
        previewKey: { $ref: "#/components/schemas/ObjectKey" }
        width: { type: integer }
        height: { type: integer }
        durationMs: { type: integer }
    Attachment:
      type: object
      required: [type, mime, width, height, durationMs, objectKey, url, previewKey, previewUrl]
      properties:
        type: { type: string, enum: [image, video] }
        mime: { type: string }
        width: { type: integer }
        height: { type: integer }
        durationMs: { type: integer }
        objectKey: { $ref: "#/components/schemas/ObjectKey" }
        url: { type: string, description: "Presigned GET URL (1 hour)" }
        previewKey: { $ref: "#/components/schemas/ObjectKey" }
        previewUrl: { type: string }
    Post:
      type: object
      required: [postId, authorId, author, text, createdAt, media, replyCount, likeCount, likedByMe]
      properties:
        postId: { $ref: "#/components/schemas/Id" }
        authorId: { $ref: "#/components/schemas/Id" }
        author: { $ref: "#/components/schemas/Person" }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        media: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
        replyCount: { type: integer }
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        audience:
          description: Only on my own posts
          oneOf:
            - { $ref: "#/components/schemas/Audience" }
            - { type: "null" }
    Reply:
      type: object
      required: [replyId, authorId, author, text, createdAt, likeCount, likedByMe]
      properties:
        replyId: { $ref: "#/components/schemas/Id" }
        authorId: { $ref: "#/components/schemas/Id" }
        author: { $ref: "#/components/schemas/Person" }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        parentId:
          type: [string, "null"]
          format: uuid
          description: The reply this answers; null for a reply to the post, or when I can't see that reply
        replyingTo:
          description: Who wrote the reply this answers (null in the same cases as parentId)
          oneOf: [{ $ref: "#/components/schemas/Person" }, { type: "null" }]
    Message:
      type: object
      required: [seq, messageId, senderId, text, media, createdAt]
      properties:
        seq: { type: integer, format: int64 }
        messageId: { $ref: "#/components/schemas/Id" }
        senderId: { $ref: "#/components/schemas/Id" }
        text: { type: string }
        media: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
        createdAt: { type: string, format: date-time }
    Chat:
      type: object
      required: [chatId, members, unread, readSeq, updatedAt]
      properties:
        chatId: { $ref: "#/components/schemas/Id" }
        name: { type: [string, "null"] }
        members: { type: array, items: { $ref: "#/components/schemas/Person" } }
        lastMessage:
          oneOf:
            - { $ref: "#/components/schemas/Message" }
            - { type: "null" }
        unread: { type: integer }
        readSeq: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }

    DeskBoard:
      type: object
      required: [id, name, todos, notes, files, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        todos: { type: integer, description: "Open to-dos" }
        notes: { type: integer }
        files: { type: integer }
        createdAt: { type: string, format: date-time }
    DeskRepeat:
      description: >-
        daily, weekly, monthly and yearly repeat every N of them from the first due date; weekdays is Monday to Friday;
        after is N days after it was last done
      type: object
      required: [kind, every]
      properties:
        kind: { type: string, enum: [daily, weekdays, weekly, monthly, yearly, after] }
        every: { type: integer, minimum: 1, maximum: 365 }
    DeskTodo:
      type: object
      required: [id, boardId, boardName, title, description, dueDate, repeat, doneAt, commentCount, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        boardId: { $ref: "#/components/schemas/Id" }
        boardName: { type: string }
        title: { type: string }
        description: { type: string }
        dueDate: { type: [string, "null"], format: date }
        repeat: { oneOf: [{ $ref: "#/components/schemas/DeskRepeat" }, { type: "null" }] }
        doneAt: { type: [string, "null"], format: date-time }
        commentCount: { type: integer }
        createdAt: { type: string, format: date-time }
    DeskNoteSummary:
      type: object
      required: [id, boardId, title, snippet, pinned, commentCount, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        boardId: { $ref: "#/components/schemas/Id" }
        title: { type: string }
        snippet: { type: string, description: "The start of the description on one line" }
        pinned: { type: boolean }
        commentCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DeskNote:
      type: object
      required: [id, boardId, boardName, title, description, pinned, commentCount, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        boardId: { $ref: "#/components/schemas/Id" }
        boardName: { type: string }
        title: { type: string }
        description: { type: string }
        pinned: { type: boolean }
        commentCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DeskComment:
      type: object
      required: [id, body, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    DeskFile:
      type: object
      required: [id, boardId, boardName, title, description, fileName, mime, kind, sizeBytes, width, height, durationMs, objectKey, url,
        previewKey, previewUrl, commentCount, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        boardId: { $ref: "#/components/schemas/Id" }
        boardName: { type: string }
        title: { type: string }
        description: { type: string }
        fileName: { type: string }
        mime: { type: string }
        kind: { type: string, enum: [image, video, file], description: "image and video have a thumbnail or poster frame" }
        sizeBytes: { type: integer, format: int64 }
        width: { type: integer }
        height: { type: integer }
        durationMs: { type: integer }
        objectKey: { $ref: "#/components/schemas/ObjectKey" }
        url: { type: string, description: "Presigned GET URL (1 hour)" }
        previewKey: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
        previewUrl: { type: [string, "null"] }
        commentCount: { type: integer }
        createdAt: { type: string, format: date-time }
