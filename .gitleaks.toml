title = "circlo gitleaks config"

# Keep every default gitleaks rule.
[extend]
useDefault = true

# Allow-list ONLY obvious placeholders used in .env.example files and test fixtures.
# Never add a real-looking value here. Test vectors under core/test_vectors/ are
# public by design (PLAN.md 0B) and are the only path exempted.
[[allowlists]]
description = "Placeholders and public crypto labels"
regexes = [
  '''change-me''',
  '''test-only-not-a-secret''',
  '''_TEST_ONLY''',
  # Public crypto domain-separation labels (docs/CRYPTO.md), e.g. "circlo/v1/reply".
  '''^circlo/v1/[a-z0-9/-]+$''',
  # The same labels under the project's earlier name; they exist only in history from before the rename.
  '''^halqo/v1/[a-z0-9/-]+$''',
]

[[allowlists]]
description = "Public test vectors"
paths = [
  '''^core/test_vectors/''',
]

# A crates.io package *name* (libcrux-secrets, pulled in by OpenMLS) in Cargo.lock dependency lists trips the
# generic-api-key rule. Allowed only when the match is that crate name, and only in lockfiles.
[[allowlists]]
description = "Crate names in Cargo.lock"
condition = "AND"
paths = ['''(^|/)Cargo\.lock$''']
regexTarget = "match"
regexes = ['''libcrux-secrets''']

# The app's blocklist of common leaked passwords (public breach data, so nobody can choose one; see
# app/src/lib/password-strength.ts). A few entries sit next to the word "password" and trip generic-api-key.
[[allowlists]]
description = "Public leaked-password blocklist"
paths = ['''^app/src/lib/leaked-passwords\.json$''']
