# Generates @circlo/core from the Rust crate in core/ (docs/PLAN.md: crate circlo-core → package @circlo/core).
rust:
  directory: ../../../core
  manifestPath: Cargo.toml
jsi2:
  ts: src/generated
  androidTargets: [arm64-v8a, x86_64]
  minIosVersion: "15.1"
  bundleIdPrefix: com.circlo
android:
  directory: ./android
  apiLevel: 24
