# cargo-deny (PLAN.md Phase 12 dependency audit): known vulnerabilities, licences compatible with AGPL-3.0,
# and crates only from crates.io. Run with `cargo deny check` in core/ (CI: deps-audit workflow).

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the build, including unmaintained and unsound crates. Accepted ones are listed here
# with a reason, and are reviewed again by 2027-01-31 (same date as osv-scanner.toml).
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 timing: only reached through P-256/P-384 code in OpenMLS's provider; Halqo uses ciphersuite 0x0003 (X25519/Ed25519) only, so no secret reaches it. Needs an upstream OpenMLS release." },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained: build-time proc macro (hax-lib-macros via libcrux), never in the shipped library." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses.private]
# halqo-core itself (AGPL-3.0-only, publish = false).
ignore = true
