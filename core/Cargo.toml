[package]
name = "circlo-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "Circlo crypto core: the only place Circlo implements cryptography (see docs/CRYPTO.md)"
publish = false

[lib]
name = "circlo_core"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# Crypto (docs/CRYPTO.md section 2). One RustCrypto generation (digest 0.10 / rand_core 0.6) where possible.
chacha20poly1305 = { version = "0.10", features = ["stream"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
opaque-ke = { version = "4", default-features = false, features = ["ristretto255", "argon2"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
bip39 = { version = "2", default-features = false, features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# hpke 0.13 uses the rand_core 0.9 traits.
rand_core09 = { package = "rand_core", version = "0.9", features = ["os_rng"] }
subtle = "2.6"
# Messaging (docs/CRYPTO.md section 13): MLS RFC 9420, ciphersuite 0x0003, OpenMLS with RustCrypto primitives.
openmls = "0.9.2"
openmls_rust_crypto = "0.6"
openmls_basic_credential = "0.6"
openmls_memory_storage = "0.6"
openmls_traits = "0.6"
tls_codec = "0.4"
zeroize = { version = "1", features = ["derive"] }

# Encoding / plumbing
ciborium = "0.2"
unicode-normalization = "0.1"
thiserror = "2"
uniffi = "0.31"
# Server bridge (circlo-server calls the core through JNI). Off for mobile builds.
jni = { version = "0.21", optional = true }

[features]
jni = ["dep:jni"]
# Client operations over JNI for circlo-server integration tests only (never in production server builds).
jni-test-client = ["jni"]

[dev-dependencies]
proptest = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

# Argon2id at 64 MiB is painfully slow unoptimised; optimise crypto deps in dev/test builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# For the app's library (ubrn --profile app): optimised like release, but a bug surfaces as a JS error
# (uniffi catches the panic) instead of killing the app; debug info stripped to keep the package small.
[profile.app]
inherits = "release"
panic = "unwind"
strip = "debuginfo"

# For circlo-server's JNI library: a bug must surface as a Java exception, never abort the JVM.
[profile.server]
inherits = "release"
panic = "unwind"
