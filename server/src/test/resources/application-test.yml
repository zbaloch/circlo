# Integration tests: ONLY the halqo_test database and halqo-media-test bucket. Never halqo.
# Locally the values come from server/.env; in CI from HALQO_* environment variables.
spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${HALQO_TEST_DB_URL:jdbc:mariadb://localhost:3306/halqo_test}
  flyway:
    clean-disabled: false

halqo:
  auth:
    # Many auth calls come from localhost in tests; production keeps the default of 30/minute.
    ip-requests-per-minute: 100000
  s3:
    bucket: halqo-media-test
