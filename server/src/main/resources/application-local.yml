# Local dev: run from server/ with `mvn spring-boot:run -Dspring-boot.run.profiles=local`.
# Secrets come from the git-ignored server/.env (KEY=value lines).
spring:
  config:
    import: optional:file:./.env[.properties]

circlo:
  mail:
    # Codes are printed to the console unless server/.env sets CIRCLO_MAIL_MODE=smtp and an SMTP server.
    mode: ${CIRCLO_MAIL_MODE:log}
  # The Expo web dev server.
  cors:
    origins: ${CIRCLO_CORS_ORIGINS:http://localhost:8081}
