spring:
  application:
    name: halqo-server
  datasource:
    url: ${HALQO_DB_URL:jdbc:mariadb://localhost:3306/halqo}
    username: ${HALQO_DB_USER:halqo}
    password: ${HALQO_DB_PASSWORD}
    # Sized by the Phase 12 load test (64 concurrent clients queued behind Hikari's default of 10).
    hikari:
      maximum-pool-size: ${HALQO_DB_POOL_SIZE:24}
  flyway:
    clean-disabled: true

server:
  port: ${HALQO_SERVER_PORT:8080}
  # No access log: we never record IPs or request lines.
  tomcat:
    accesslog:
      enabled: false

halqo:
  core:
    # Native halqo-core built with: cargo build --features jni --profile server (in core/)
    library: ${HALQO_CORE_LIBRARY:}
  secrets:
    opaque-server-setup: ${HALQO_OPAQUE_SERVER_SETUP:}
    handle-key: ${HALQO_HANDLE_KEY:}
    push-token-key: ${HALQO_PUSH_TOKEN_KEY:}
    jwt-key: ${HALQO_JWT_KEY:}
  # FCM HTTP v1 for content-free pushes; both empty = push off.
  push:
    fcm:
      project-id: ${HALQO_FCM_PROJECT_ID:}
      service-account: ${HALQO_FCM_SERVICE_ACCOUNT:}
  auth:
    access-ttl: 15m
    refresh-ttl: 30d
    recovery-ttl: 15m
    challenge-ttl: 60s
    # Time to write down and confirm the 24-word phrase.
    pending-registration-ttl: 30m
  s3:
    bucket: ${HALQO_S3_BUCKET:halqo-media}
    public-endpoint: ${HALQO_S3_PUBLIC_ENDPOINT}
    region: ${HALQO_S3_REGION:us-east-1}
    access-key: ${HALQO_S3_ACCESS_KEY}
    secret-key: ${HALQO_S3_SECRET_KEY}
    put-ttl: 15m
    get-ttl: 5m

logging:
  level:
    root: INFO
    # Never log request bodies, headers or client addresses.
    org.springframework.web: INFO
    org.apache.coyote: WARN
    # Flyway logs the JDBC URL (database host and user) at INFO: keep hostnames and internal IPs out of logs.
    org.flywaydb.core.FlywayExecutor: WARN
