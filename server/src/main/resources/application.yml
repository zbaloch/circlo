spring:
  application:
    name: circlo-server
  datasource:
    url: ${CIRCLO_DB_URL:jdbc:mariadb://localhost:3306/circlo}
    username: ${CIRCLO_DB_USER:circlo}
    password: ${CIRCLO_DB_PASSWORD}
    # Sized by the Phase 12 load test (64 concurrent clients queued behind Hikari's default of 10).
    hikari:
      maximum-pool-size: ${CIRCLO_DB_POOL_SIZE:24}
  flyway:
    clean-disabled: true
  # Verification and password-reset codes. Any SMTP provider works (Postmark, SES, Resend, Mailgun, ...).
  mail:
    host: ${CIRCLO_MAIL_HOST:}
    port: ${CIRCLO_MAIL_PORT:587}
    username: ${CIRCLO_MAIL_USERNAME:}
    password: ${CIRCLO_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

server:
  port: ${CIRCLO_SERVER_PORT:8080}
  # No access log: we never record IPs or request lines.
  # Client address for rate limits behind a reverse proxy: Tomcat's RemoteIpValve takes X-Forwarded-For only from
  # proxies matching CIRCLO_TRUSTED_PROXIES (a regex of proxy IPs). Empty (the default) trusts no proxy, so clients
  # can't spoof their address. See docs/HARDENING.md, "Rate limiting".
  forward-headers-strategy: native
  tomcat:
    accesslog:
      enabled: false
    remoteip:
      internal-proxies: ${CIRCLO_TRUSTED_PROXIES:}

circlo:
  secrets:
    jwt-key: ${CIRCLO_JWT_KEY:}
  mail:
    # smtp (default), or log to print emails to the console (local development only).
    mode: ${CIRCLO_MAIL_MODE:smtp}
    from: ${CIRCLO_MAIL_FROM:Circlo <no-reply@hellocirclo.com>}
  # Browser origins allowed to call the API (the web app), comma-separated, e.g. https://app.hellocirclo.com
  cors:
    origins: ${CIRCLO_CORS_ORIGINS:}
  invite-base: ${CIRCLO_INVITE_BASE:https://www.hellocirclo.com/i/}
  auth:
    access-ttl: 15m
    refresh-ttl: 30d
    code-ttl: 15m
    pending-signup-ttl: 1d
  s3:
    bucket: ${CIRCLO_S3_BUCKET:circlo-media}
    public-endpoint: ${CIRCLO_S3_PUBLIC_ENDPOINT}
    region: ${CIRCLO_S3_REGION:us-east-1}
    access-key: ${CIRCLO_S3_ACCESS_KEY}
    secret-key: ${CIRCLO_S3_SECRET_KEY}
    put-ttl: 15m
    get-ttl: 1h

logging:
  level:
    root: INFO
    # Never log request bodies, headers or client addresses.
    org.springframework.web: INFO
    org.apache.coyote: WARN
    # Flyway logs the JDBC URL (database host and user) at INFO: keep hostnames and internal IPs out of logs.
    org.flywaydb.core.FlywayExecutor: WARN
