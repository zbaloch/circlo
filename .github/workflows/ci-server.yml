name: ci-server

on:
  pull_request:
    paths: ["server/**", "docs/api/**", ".github/workflows/ci-server.yml"]
  push:
    branches: [main]
    paths: ["server/**", "docs/api/**", ".github/workflows/ci-server.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # CI-only database. Local dev always uses the existing install in WSL.
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: halqo_test
          MARIADB_USER: halqo
          MARIADB_PASSWORD: test-only-not-a-secret
          MARIADB_ROOT_PASSWORD: test-only-not-a-secret
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      HALQO_DB_USER: halqo
      HALQO_DB_PASSWORD: test-only-not-a-secret
      HALQO_TEST_DB_URL: jdbc:mariadb://127.0.0.1:3306/halqo_test
      HALQO_S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      HALQO_S3_ACCESS_KEY: test-only-not-a-secret
      HALQO_S3_SECRET_KEY: test-only-not-a-secret
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify
