name: ci-server

on:
  pull_request:
    paths: ["server/**", "core/**", "docs/api/**", ".github/workflows/ci-server.yml"]
  push:
    branches: [main]
    paths: ["server/**", "core/**", "docs/api/**", ".github/workflows/ci-server.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # CI-only database. Local dev always uses the existing install in WSL.
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: halqo_test
          MARIADB_USER: halqo
          MARIADB_PASSWORD: test-only-not-a-secret
          MARIADB_ROOT_PASSWORD: test-only-not-a-secret
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      HALQO_DB_USER: halqo
      HALQO_DB_PASSWORD: test-only-not-a-secret
      HALQO_TEST_DB_URL: jdbc:mariadb://127.0.0.1:3306/halqo_test
      HALQO_S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      HALQO_S3_ACCESS_KEY: test-only-not-a-secret
      HALQO_S3_SECRET_KEY: test-only-not-a-secret
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Start MinIO (CI only) with the halqo-media-test bucket
        run: |
          docker run -d --name halqo-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=test-only-not-a-secret -e MINIO_ROOT_PASSWORD=test-only-not-a-secret \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          docker exec -e MC_HOST_local=http://test-only-not-a-secret:test-only-not-a-secret@localhost:9000 \
            halqo-minio mc mb --ignore-existing local/halqo-media-test
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: core
          key: server-jni
      - name: Build native halqo-core for the server (with the test client)
        working-directory: core
        run: cargo build --features jni-test-client --profile server
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify
