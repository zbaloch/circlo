name: ci-core

on:
  pull_request:
    paths: ["core/**", ".github/workflows/ci-core.yml"]
  push:
    branches: [main]
    paths: ["core/**", ".github/workflows/ci-core.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: 200 MB file streams in constant memory
        run: |
          cargo test --release --test flows --no-run
          /usr/bin/time -v cargo test --release --test flows -- --ignored large_file 2> time.txt
          grep "Maximum resident set size" time.txt

  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Two release builds from different directories are byte-identical
        run: core/scripts/check-reproducible.sh

  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/fuzz
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: core/fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz every decrypt/parse target for 30 s
        run: |
          for t in $(cargo fuzz list); do
            echo "::group::$t"
            cargo fuzz run "$t" -- -max_total_time=30 -rss_limit_mb=4096
            echo "::endgroup::"
          done
